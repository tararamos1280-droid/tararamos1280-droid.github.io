<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Bus Adventure — Employment Skills Game Hub</title>
<meta name="description" content="Practice a real bus trip in Johnstown (CamTran) or Altoona (AMTRAN): plan with the schedule, find the stop, ride, and get home.">
<style>:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2533;--muted:#4a5565;--line:#dfe5ec;--pri:#0f766e;--pri-d:#0a5550;--pri-l:#e3f3f1;
--good:#146c35;--good-l:#e6f5eb;--bad:#a3221a;--bad-l:#fdecea;--warn:#7a3d00;--warn-l:#fff4dc;--blue:#1d4ed8;--blue-l:#e8efff;
--r:20px;--sh:0 4px 16px rgba(20,30,50,.08),0 1px 3px rgba(20,30,50,.06)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--pri-d)}
:focus{outline:none}
:focus-visible{outline:4px solid #f59e0b !important;outline-offset:3px}
h1{font-size:28px;line-height:1.2;margin:4px 0 8px}
h1:focus{outline:none}
h2{font-size:22px;line-height:1.25;margin:0 0 10px}
h3{font-size:20px;margin:0 0 8px}
p{margin:0 0 10px}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:#fff;padding:12px 18px;border-radius:12px;font-weight:800}
.skip:focus{left:8px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:rgba(255,255,255,.98);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--pri-d);min-width:0}
.brand-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand a{font-size:15px;font-weight:700;white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center}
.tbtn{min-height:52px;min-width:52px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tbtn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.progress{display:flex;gap:6px;padding:10px 16px 0;max-width:900px;margin:0 auto}
.pstep{flex:1;text-align:center;font-size:14px;color:#5b6676;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstep .pb{height:7px;border-radius:7px;background:#d9e0e8;margin-bottom:4px}
.pstep.done .pb{background:#8ccbc3}
.pstep.cur .pb{background:var(--pri)}
.pstep.cur{color:var(--pri-d)}
.status{max-width:900px;margin:6px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:16px;font-weight:700}
.chip.clock{border-color:#9fd5ce}
.chip.goal{border-color:#f2c46d}
.screen{max-width:900px;margin:0 auto;padding:8px 16px 20px}
.anim{animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:15px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 0}
.lead{font-size:19px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:12px 0}
.actions{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:6px;background:linear-gradient(rgba(243,245,249,0),var(--bg) 30%)}
.actions .sp{flex:1}
.btn{min-height:58px;padding:0 22px;border-radius:16px;border:2px solid transparent;font-weight:800;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh);text-align:center;line-height:1.2}
.btn.primary{background:var(--pri);color:#fff}
.btn.secondary{background:#fff;border-color:#c9d3de;color:var(--ink)}
.btn.link{background:none;box-shadow:none;color:var(--pri-d);text-decoration:underline;min-height:52px;padding:0 10px;font-size:17px}
.btn[disabled]{background:#e4e8ee;color:#5f6a7a;box-shadow:none;cursor:not-allowed;border-color:transparent}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.choices{display:grid;gap:12px;margin:14px 0;grid-template-columns:1fr}
.choice{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 16px;min-height:64px;width:100%;font-weight:700;font-size:19px}
.choice .ci{font-size:30px;line-height:1;flex:0 0 auto}
.choice .ct{flex:1;min-width:0}
.choice .ct b{display:block;font-size:19px}
.choice .ct span{display:block;font-size:16px;font-weight:600;color:var(--muted)}
.choice.sel{border-color:var(--pri);background:var(--pri-l)}
.choice.right{border-color:#2f9e5b;background:var(--good-l)}
.choice.wrong{border-color:#d9a33b;background:var(--warn-l)}
.choice[disabled]{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;font-size:18px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
.feedback .fi{font-size:24px;line-height:1.1;flex:0 0 auto}
.feedback.good{background:var(--good-l);color:#0e4d27}
.feedback.tip{background:var(--blue-l);color:#1b3a8a}
.feedback.warn{background:var(--warn-l);color:var(--warn)}
.feedback.bad{background:var(--bad-l);color:var(--bad)}
.hint{border:2px dashed #93b4f5;background:#f5f8ff;border-radius:14px;padding:10px 14px;font-size:17px;color:#1b3a8a;margin:8px 0}
.hint b{color:#12307a}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.city{display:flex;flex-direction:column;text-align:left;background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:0;overflow:hidden;width:100%}
.city .cimg{aspect-ratio:16/9;background:#dfe7ee;overflow:hidden}
.city .cimg img,.city .cimg svg{width:100%;height:100%;object-fit:cover;display:block}
.city .ctx{padding:14px 16px}
.city .cn{display:block;font-size:26px;font-weight:900;letter-spacing:.02em}
.city .ca{display:block;font-size:17px;color:var(--muted);font-weight:700}
.dest{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;width:100%;min-height:72px}
.dest .di{width:84px;height:56px;flex:0 0 84px;border-radius:10px;overflow:hidden;background:#e5ebf0}
.dest .di svg{width:100%;height:100%;display:block}
.dest .dt{flex:1;min-width:0}
.dest .dt b{display:block;font-size:19px}
.dest .dt span{display:block;font-size:16px;color:var(--muted);font-weight:600}
.dest .done{font-size:14px;font-weight:800;color:var(--good);background:var(--good-l);padding:2px 10px;border-radius:999px;white-space:nowrap}
.dest .hardtag{font-size:14px;font-weight:800;color:var(--warn);background:var(--warn-l);padding:2px 10px;border-radius:999px;white-space:nowrap}
.dests{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin:12px 0}
.fig{margin:10px 0;background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.fig svg,.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:15px;color:var(--muted);padding:8px 12px;font-weight:600}
.fig figcaption b{color:var(--ink)}
.illus-tag{display:inline-block;font-size:13px;font-weight:800;background:#eef1f5;color:#3b4656;border-radius:999px;padding:1px 10px;margin-right:6px}
.photo-tag{display:inline-block;font-size:13px;font-weight:800;background:#e3f3f1;color:var(--pri-d);border-radius:999px;padding:1px 10px;margin-right:6px}
.facts{list-style:none;padding:0;margin:6px 0}
.facts li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:18px}
.facts li:last-child{border-bottom:none}
.facts li .k{flex:0 0 120px;font-weight:800;color:var(--muted);font-size:16px}
.timeline{list-style:none;padding:0;margin:6px 0}
.timeline li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:18px}
.timeline li .tm{flex:0 0 92px;font-weight:800;color:var(--pri-d)}
/* phone */
.phone{max-width:430px;margin:12px auto;background:#111;border-radius:34px;padding:12px 10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pscreen{background:#fff;border-radius:24px;overflow:hidden}
.pbar{display:flex;justify-content:space-between;align-items:center;background:#f2f4f7;padding:6px 14px;font-size:14px;font-weight:800;color:#333}
.papp{padding:10px 10px 12px}
.papp h2{font-size:19px;margin:0 0 2px}
.practice{display:block;background:#fff4dc;color:#7a3d00;border:1px solid #f2c46d;border-radius:10px;padding:5px 8px;font-size:14px;font-weight:800;margin:6px 0}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pchip{min-height:44px;min-width:44px;border-radius:12px;border:2px solid #c9d3de;background:#fff;font-weight:800;font-size:16px;padding:0 10px}
.pchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pchip.day.on{background:#334155;border-color:#334155}
.rnote{font-size:14px;color:#3b4656;margin:4px 0 6px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #cfd8e3;border-radius:10px;max-height:340px;overflow-y:auto}
.stbl{border-collapse:separate;border-spacing:0;font-size:15px;min-width:100%}
.stbl th{position:sticky;top:0;background:#1f3b57;color:#fff;font-size:12.5px;line-height:1.15;padding:6px 4px;min-width:66px;max-width:86px;vertical-align:bottom;text-align:center;font-weight:800;z-index:1}
.stbl th.hl{background:#0f766e}
.stbl td{padding:0;border-bottom:1px solid #e5eaf0;text-align:center}
.stbl tr:nth-child(even) td{background:#f7f9fb}
.cell{width:100%;min-height:44px;border:2px solid transparent;background:transparent;font-weight:700;font-size:15px;padding:0 2px;border-radius:8px}
.cell.hl{background:#e3f3f1}
.cell.b{background:#0f766e;color:#fff;border-color:#0a5550}
.cell.a{background:#1d4ed8;color:#fff;border-color:#12307a}
.cell.rowsel{border-color:#94a3b8}
.cell.past{color:#8a94a3}
.cell.none{color:#9aa3af;cursor:default}
.swipe{font-size:13px;color:#4a5565;margin:4px 2px}
.tripview{margin-top:8px;border:2px solid #cfd8e3;border-radius:12px;padding:6px 8px}
.tripview h3{font-size:16px;margin:2px 0 4px}
.tv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;border:2px solid transparent;background:#fff;border-radius:10px;padding:2px 8px;font-size:16px;text-align:left}
.tv .tvt{font-weight:800;white-space:nowrap}
.tv.b{background:#0f766e;color:#fff}
.tv.a{background:#1d4ed8;color:#fff}
.tv.mine{border-color:#f59e0b}
.psum{margin-top:8px;background:#f2f4f7;border-radius:12px;padding:8px 10px;font-size:16px}
.nosvc{background:#fdecea;color:#a3221a;border-radius:12px;padding:14px;font-weight:800;text-align:center;font-size:17px}
/* scenes */
.scene-btns{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:10px 0}
.lineup{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0}
.busbtn{background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--sh)}
.busbtn svg{width:100%;height:auto;display:block}
.busbtn span{display:block;font-weight:800;font-size:16px;padding:4px 0 2px}
.busbtn.sel{border-color:var(--pri);background:var(--pri-l)}
.stoplist{list-style:none;margin:6px 0;padding:0}
.stoplist li{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:18px}
.stoplist li .tm{flex:0 0 84px;font-weight:800;color:var(--pri-d)}
.stoplist li.next{background:#fff4dc;border-radius:10px;font-weight:800}
.stoplist li.passed{color:#8a94a3;text-decoration:line-through}
.stoplist li.mine .nm::after{content:" ← your stop";color:#7a3d00;font-weight:800}
.indep .mine .nm::after{content:""}
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,23,35,.5);display:flex;align-items:center;justify-content:center;padding:12px}
.modal-card{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;max-width:860px;width:100%;max-height:calc(100vh - 24px);overflow:auto}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.coach h3{border-top:1px solid var(--line);padding-top:14px}
.coach details{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:8px 0}
.coach summary{min-height:52px;display:flex;align-items:center;font-weight:800;font-size:18px;cursor:pointer}
.cgrid{display:grid;align-items:end;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;padding-bottom:8px}
.cfield label{display:block;font-size:15px;font-weight:700;color:var(--muted)}
.cfield select{width:100%;min-height:50px;font-size:18px;padding:6px 10px;border:2px solid #b9c5d3;border-radius:12px;background:#fff}
.coach ul{margin:4px 0 8px;padding-left:22px;font-size:16px}
.coach li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2a37;color:#fff;font-size:18px;font-weight:600;padding:12px 20px;border-radius:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:160;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@media (max-width:600px){
 body{font-size:18px}
 h1{font-size:24px}
 .tbtn .tl{display:none}
 .tbtn{padding:0 8px;min-width:48px}
 .brand{font-size:16px;gap:6px}
 .brand .brand-t{display:none}
 .top-actions{gap:4px}
 .pstep{font-size:0}
 .screen{padding:6px 12px 16px}
 .card{padding:14px}
 .btn{font-size:18px;padding:0 14px}
 .actions .btn{flex:1 1 auto}
 .dests{grid-template-columns:1fr}
 .phone{border-radius:26px;padding:8px 6px 10px;margin:8px -4px}
 .facts li{flex-direction:column;gap:0}
 .facts li .k{flex:none}
}
@media (max-width:360px){
 .tbtn{min-width:44px;min-height:48px;padding:0 6px}
 .choice{padding:12px;font-size:18px}
 .stbl th{min-width:60px}
}
.wrap{max-width:900px;margin:0 auto}
#main{max-width:900px;margin:0 auto}
.foot{max-width:900px;margin:0 auto;padding:12px 16px 40px}
.qcard h2{font-size:21px}
</style></head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header class="top"><a class="tbtn" href="/">← Game Hub</a><div class="top-actions"><button class="tbtn" id="bRead" type="button">🔊 <span class="tl">Read aloud</span></button><button class="tbtn" id="bStop" type="button" aria-label="Stop reading">⏹ <span class="tl">Stop</span></button><button class="tbtn" id="bRestart" type="button">↺ <span class="tl">Start again</span></button><button class="tbtn" id="bHelp" type="button">⚙ <span class="tl">Helper</span></button></div></header>
<div class="wrap">
<nav class="progress" id="progress" aria-label="Trip progress"></nav>
<div class="status" id="status" aria-label="Trip status"></div>
<main id="main" tabindex="-1"></main>
<footer class="foot small muted">Bus Adventure · Practice schedules — verify current times before traveling. No personal information is collected; progress is saved only on this device.</footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="hidden"></div>

/* ---------- schedule logic ---------- */
function legPlan(leg,rk,row,bKey,aKey,now,day){
 const T=tbl(rk,day);if(!T)return {ok:false,kind:'nosvc',msg:'This route does not run on this day.'};
 const bi=colIdx(rk,bKey),ai=colIdx(rk,aKey);const R=T[row];const dep=R[bi],arr=R[ai];
 const opt=leg.opts.find(o=>o.r===rk&&o.b.includes(bKey)&&o.a.includes(aKey));
 const res={dep,arr,rk,row,bKey,aKey,opt,bi,ai};
 if(typeof dep!=='number'||typeof arr!=='number')return Object.assign(res,{ok:false,kind:'blank',msg:'One of those times is blank. The bus does not stop there on that trip. Pick a trip with times in both places.'});
 if(ai<=bi)return Object.assign(res,{ok:false,kind:'order',msg:'Tap the time where you get ON first, then the time where you get OFF. The bus travels left to right across the row.'});
 if(!opt){
  if(leg.wrong&&leg.wrong[bKey])return Object.assign(res,{ok:false,kind:'dir',msg:leg.wrong[bKey]});
  const anyR=leg.opts.some(o=>o.r===rk);
  if(!anyR)return Object.assign(res,{ok:false,kind:'route',msg:rName(rk)+' is not a good bus for this trip. '+ROUTES[rk].note+' Look at the other routes.'});
  const o=leg.opts.find(o=>o.r===rk);
  const bWant=o.b.map(k=>ROUTES[rk].cols[colIdx(rk,k)][1]);const aWant=o.a.map(k=>ROUTES[rk].cols[colIdx(rk,k)][1]);
  if(!o.b.includes(bKey))return Object.assign(res,{ok:false,kind:'board',msg:'Check where you get on. For this trip, get on at the "'+bWant.join('" or "')+'" column.'});
  return Object.assign(res,{ok:false,kind:'alight',msg:'Check where you get off. '+(leg.between?leg.between:'Use the "'+aWant.join('" or "')+'" column.')});
 }
 if(dep<now)return Object.assign(res,{ok:false,kind:'past',msg:'That bus leaves at '+fmt(dep)+'. You will not be at the stop until '+fmt(now)+'. Pick a later bus.'});
 return Object.assign(res,{ok:true});
}
function allTrips(leg,day,after){const out=[];leg.opts.forEach(o=>{const T=tbl(o.r,day);if(!T)return;o.b.forEach(bk=>o.a.forEach(ak=>{const bi=colIdx(o.r,bk),ai=colIdx(o.r,ak);if(bi<0||ai<=bi)return;T.forEach((R,row)=>{if(typeof R[bi]==='number'&&typeof R[ai]==='number'&&R[bi]>=after)out.push({rk:o.r,row,bKey:bk,aKey:ak,dep:R[bi],arr:R[ai],opt:o})})}))});return out.sort((a,b)=>a.dep-b.dep||a.arr-b.arr)}
const walkFor=(t,opt)=>(opt&&opt.walk)||t.walk;
const goalTime=t=>t.start-5;
/* best on-time option from a time */
function bestOnTime(t,day,after){const leg=outLegs(t)[0];const L=allTrips(leg,day,after).filter(x=>x.arr+walkFor(t,x.opt)<=goalTime(t));return L.length?L[L.length-1]:null}
function outLegs(t){return t.legs||[t.out]}

function renderQs(scr,qs){let h='';let allDone=true;
 for(const q of qs){const st=qa(scr+':'+q.id);const ans=st&&st.k;const ch=ans&&q.a.find(a=>a[0]===ans);const ok=ch&&ch[2]>=1;

  h+='</div>';
  if(ch){const best=q.a.filter(a=>a[2]===2).map(a=>a[1]);
   if(ch[2]===2)h+=fb('good',(ch[3]||'')+(q.why?' '+q.why:''));
   else if(ch[2]===1)h+=fb('tip',(ch[3]||'This can work.')+' <b>Most effective:</b> '+best[0]+'. '+(q.why||''));

  h+='</div>';
  if(!ok){allDone=false;break}}
 return {h,allDone}}

}

 S.t.back.forEach((b,i)=>{const others=busChoices(b).slice(0,2);const opts=[[b.rk,ROUTES[b.rk].num+' '+signText(b.rk),2,'Right.'],...others.map(k=>[k,ROUTES[k].num+' '+signText(k),0,'Check the number. You planned Route '+ROUTES[b.rk].num+'.'])];if(i%2===0)opts.push(opts.shift());
  const at=stopLabel(b.rk,b.aKey);
  qs.push({id:'bus'+i,q:`${i?'Next bus. ':''}A bus is coming at ${fmt(b.dep)}. Which sign tells you it is your bus?`,a:opts});
  if(i===0||c.id==='J')qs.push({id:'pay'+i,q:'How do you pay?',a:i>0?[['tr','Show or use my transfer from the first bus',2,'Right. Walmart is a free transfer point.'],['five','Give a $5 bill and wait for change',0,'Drivers do not give change.']]:c.id==='J'?[['card','Tap my CamTran card',2,'Right.'],['five','Give a $5 bill and wait for change',0,'Drivers do not give change.'],['cash','Exact fare, $1.75',1,'Exact cash works too.']]:[['cash','Exact fare, $1.75, or EZfare',2,'Right.'],['five','Give a $5 bill and wait for change',0,'Drivers do not give change.'],...(t.backLegs?[['tr','Exact fare, and ask for a transfer for my next bus',2,'Right. Walmart is a free transfer point.']]:[])]});
  const lastLeg=i===S.t.back.length-1;
  if(lastLeg&&c.id==='J'&&b.aKey!=='TC2')qs.push({id:'off'+i,q:'When do you request your stop?',a:[['early','As soon as I sit down',0,'Wait until your stop is next.'],['next','When the next stop is Widman & Solomon (Solomon Homes)',2,'Right. '+c.signal],['after','After the bus passes Solomon Homes',0,'Then you would miss your stop.']]});
  else if(lastLeg)qs.push({id:'off'+i,q:'Where do you get off?',a:[['tc','At the Transit Center — the bus ends its trip there. I wait until it stops.',2,'Right.'],['first','At the first stop, to be safe',0,'That is not your stop.'],['any','When I feel like it',0,'Get off at your planned stop.']]});
  else qs.push({id:'off'+i,q:`Where do you get off to change buses?`,a:[['xfer',`At ${at} — then catch my next bus there`,2,'Right.'],['tc','Stay on until the last stop',0,'You planned to change buses at '+at+'.'],['early','At the first stop',0,'That is not your stop.']]});
 });
 const r=renderQs('rideBack',qs);
 let h=`<p class="eyebrow">Step 7 · Ride back</p><h1 tabindex="-1">Ride back to ${c.id==='J'?'Solomon Homes':'downtown'}</h1><p class="lead">Your plan: ${S.t.back.map(b=>esc(rName(b.rk))+' '+fmt(b.dep)+' → '+fmt(b.arr)).join('; then ')}.</p>${r.h}`;
 h+=`<div class="actions">${r.allDone?'<span class="sp"></span><button class="btn primary" data-act="finish">Finish the trip</button>':''}</div>`;
 return {h,qs}};
SCR.finish=()=>{const t=trip(),c=city();const home=S.t.homeAt;
 let h=`<p class="eyebrow">Step 8 · Done</p><h1 tabindex="-1">Trip complete</h1><p class="lead">${S.t.ended?'You practiced planning this trip and what to do when no bus works.':'You went from '+esc(c.start)+' to '+esc(t.name)+' and back.'}</p>`;
 if(!S.t.ended){h+=`<div class="card"><h2>Your day</h2><ul class="timeline">`+S.t.log.sort((a,b)=>a[0]-b[0]).map(([tm,x])=>`<li><span class="tm">${fmt(tm)}</span><span>${esc(x)}</span></li>`).join('')+`</ul></div>`}
 if(S.t.probs.length)h+=`<div class="card"><h2>Problems you handled</h2><ul>${[...new Set(S.t.probs)].map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`;
 h+=`<div class="card"><h2>Skills you practiced</h2><ul>${['Read the schedule and chose a bus','Found the right stop and waited safely','Checked the bus sign','Paid the fare','Requested the stop','Planned the trip back'].map(s=>`<li>${s}</li>`).join('')}</ul><p class="small muted">Remember: times in this game are a practice snapshot. Check the current schedule before you travel.</p></div>`;
 h+=`<div class="actions"><button class="btn secondary" data-act="repeat">Repeat this trip</button><button class="btn secondary" data-act="go" data-v="city">Change city</button><span class="sp"></span><button class="btn primary" data-act="go" data-v="dest">Choose another place</button></div>`;
 return {h}};

/* ---------- core render / navigation ---------- */
let CUR=null;
function go(step){S.step=step;save();render(true)}
function clockNow(){const t=trip();const st=S.step;const d=S.t.delay||0;const P=S.t.plan||[];const p=P[S.t.legIdx];
 if(['retstop','offer','wrongback'].includes(st))return t.end;
 if(['phoneBack','longwait'].includes(st))return S.t.backNow;
 if(st==='rideBack')return S.t.back[0]?S.t.back[0].dep:S.t.backNow;
 if(st==='finish')return S.t.homeAt||null;
 if(st==='arrive')return S.t.atWork;
 if(p&&['bus','pay','ride'].includes(st))return Math.max(S.t.clock,p.dep+(S.t.legIdx===0?d:0));
 if(p&&st==='missedstop')return (S.t.missedAt&&S.t.missedAt.next.t)||p.arr+d;
 if(p&&st==='exit')return p.arr+d+(S.t.extra||0);
 if(st==='transfer')return P[0].arr+d+(S.t.extra||0);
 if(st==='delay'&&P.length)return P[0].dep+trip().delay;
 return S.t.clock}
function statusHTML(){if(!S.t||!S.trip||['city','dest'].includes(S.step))return '';const t=trip();const clk=clockNow();
 return `<span class="chip clock">🕒 ${clk!=null?fmt(clk):'—'}</span><span class="chip">${esc(dayLabel(S.t.day).replace(/^w/,'W'))}</span><span class="chip goal">🎯 ${esc(t.short)} by ${fmt(goalTime(t))}</span><span class="chip">${guided()?'Guided practice':'Independent practice'}</span>`}
function render(nav){const m=$('#main');const f=SCR[S.step]||SCR.city;if(!SCR[S.step])S.step='city';
 if(['city','dest'].includes(S.step)===false&&!S.t){S.step='city'}
 const out=(SCR[S.step])();CUR=out;
 const y=window.scrollY;m.innerHTML=`<div class="screen${nav?' anim':''}">${out.h}</div>`;
 const pi=STEPIDX[S.step];$('#progress').innerHTML=pi<0?'':STEPS.map((s,i)=>`<div class="pstep${i<pi?' done':i===pi?' cur':''}" ${i===pi?'aria-current="step"':''}><div class="pb"></div>${s}</div>`).join('');
 $('#progress').setAttribute('aria-label',pi<0?'':'Trip progress: step '+(pi+1)+' of '+STEPS.length+', '+STEPS[pi]);
 $('#status').innerHTML=statusHTML();
 if(nav){window.scrollTo(0,0);const h=m.querySelector('h1');if(h)h.focus({preventScroll:true});if(S.settings.autoRead)setTimeout(readScreen,250)}
 else window.scrollTo(0,y);
 save()}
function newTrip(id){const t=TRIPS.find(x=>x.id===id);S.trip=id;S.city=t.city;
 S.t={day:S.settings.day,legIdx:0,legsN:outLegs(t).length,plan:[],back:[],backIdx:0,clock:t.ready,log:[[t.ready,'Ready to leave '+CITY[t.city].start]],probs:[],qa:{},ph:{},pfb:'',rp:0};go('brief')}
function resetQ(prefix){Object.keys(S.t.qa).forEach(k=>{if(k.startsWith(prefix+':'))delete S.t.qa[k]})}
const ACT={
 city:v=>{S.city=v;go('dest')},
 trip:v=>newTrip(v),
 go:v=>{if(v==='stop'&&false){}go(v)},
 resume:()=>render(true),
 openPhone:()=>{S.t.ph={};S.t.pfb='';go('phone')},
 prt:v=>{S.t.ph.rk=v;S.t.ph.sel={};S.t.pfb='';render()},
 pday:v=>{S.t.ph.day=v;S.t.ph.sel={};S.t.pfb='';render()},
 cell:(v,el)=>{if(S.t.pdone)return;const r=+el.dataset.r,k=el.dataset.k;const s=S.t.ph.sel||{};S.t.pfb='';
  if(s.row!==r||!s.b||(s.b&&s.a))S.t.ph.sel={row:r,b:k};else if(k===s.b)S.t.ph.sel={};else S.t.ph.sel={row:r,b:s.b,a:k};render();
  const again=document.querySelector(`[data-act="cell"][data-r="${r}"][data-k="${k}"]`);if(again)again.focus({preventScroll:true});},
 usetrip:()=>{useTrip(S.step==='phone'?'out':'back');const f=$('#pfb');if(f&&f.firstChild){f.setAttribute('tabindex','-1');f.scrollIntoView({block:'center'});live(f.textContent)}},
 nobus:()=>{noBus(S.step==='phone'?'out':'back');const f=$('#pfb');if(f&&f.firstChild){f.scrollIntoView({block:'center'});live(f.textContent)}},
 replanHere:()=>{const mode=S.step==='phone'?'out':'back';S.t.pdone=null;S.t.pfb='';S.t.ph.sel={};if(mode==='out'){S.t.plan=[];S.t.legIdx=0}else{S.t.back=[];S.t.backIdx=0}render()},
 planContinue:()=>{const mode=S.step==='phone'?'out':'back';S.t.pdone=null;S.t.pfb='';
  if(mode==='out'){S.t.legIdx=0;resetQ('leave');go('leave')}
  else{const t=trip();S.t.backIdx=0;const b=S.t.back[0];S.t.log.push([b.dep,'Caught '+rName(b.rk)+' back at '+fmt(b.dep)]);const last=S.t.back[S.t.back.length-1];S.t.homeAt=last.arr;S.t.log.push([last.arr,'Back at '+(city().id==='J'?'Solomon Homes':'the Transit Center')]);
   if(S.settings.problems&&b.dep-S.t.backNow>=30){S.t.probs.push('Long wait for the bus home');go('longwait')}else go('rideBack')}},
 weekday:()=>{S.t.day='wk';S.t.plan=[];S.t.back=[];S.t.legIdx=0;S.t.backIdx=0;S.t.ph={};S.t.pfb='';S.t.pdone=null;go(S.t.nosvcMode==='back'?'phoneBack':'phone')},
 endtrip:()=>{S.t.ended=true;if(!S.done.includes(S.trip))S.done.push(S.trip);go('finish')},
 replan:()=>{resetQ('leave');resetQ('missed');S.t.plan=[];S.t.legIdx=0;S.t.ph={};S.t.pfb='';S.t.pdone=null;go('phone')},
 look:v=>{const p=S.t.plan[S.t.legIdx];const c=city();S.t.look=v==='phone'?fb('tip',`Your phone says: <b>${esc(rName(p.rk))}</b>, leaves the Transit Center at <b>${fmt(p.dep)}</b>.`,'📱'):v==='signs'?fb('tip','Each bus shows its route number and route name on the sign above the windshield, for example "6 Greenwood." Find the number you planned.','🚌'):fb('tip',`You ask: "Where do I catch Route ${ROUTES[p.rk].num} ${esc(ROUTES[p.rk].name)}?" Staff tell you which bay to wait at and remind you to check the sign on the front of the bus. You can also call AMTRAN at ${c.phone}.`,'🙋');render()},
 afterStop:()=>{S.t.log.push([S.t.clock,'Waiting at the stop']);const t=trip();if(S.settings.problems&&t.delay&&!S.t.delayDone)go('delay');else{resetQ('bus');go('bus')}},
 afterWrongSide:()=>{const a=qa('wrongside:ws');if(a&&a.k==='ride'){S.t.extra=(S.t.extra||0)+0}S.t.qa['stop:side']={k:trip().out.boardStop==='J_IN'?'in':'out',tries:1};go('stop')},
 afterDelay:()=>{S.t.delay=trip().delay;S.t.probs.push('Bus delay');S.t.delayDone=true;S.t.log.push([S.t.plan[S.t.plan.length-1].dep+trip().delay,'Bus came '+trip().delay+' minutes late']);resetQ('bus');go('bus')},
 askdriver:()=>{S.t.asked=true;render()},
 request:()=>{requestStop();const f=$('#ridefb');if(f){f.scrollIntoView({block:'center'});live(f.textContent)}},
 keepriding:()=>{keepRiding();const f=$('#ridefb');if(f&&f.textContent)live(f.textContent)},
 afterMissedStop:()=>{const m=S.t.missedAt;const add=(m.next.t!=null&&m.mine.t!=null)?2*(m.next.t-m.mine.t):10;S.t.extra=(S.t.extra||0)+add;S.t.reqOK=true;S.t.log.push([lastPlanArr(),'Missed the stop — got off at '+m.next.name+' and came back (practice estimate: +'+add+' min)']);go('exit')},
 arrive:()=>{const t=trip();const p=S.t.plan[S.t.plan.length-1];
  if(S.t.legIdx<S.t.legsN-1){S.t.legIdx++;S.t.rp=0;S.t.reqOK=false;S.t.ridefb='';resetQ('pay');resetQ('ride');resetQ('exit');S.t.clock=p.arr;go('transfer');return}
  S.t.atWork=lastPlanArr()+p.walk;S.t.log.push([S.t.atWork,'Arrived at '+t.short]);resetQ('arrive');go('arrive')},
 shiftOver:()=>{const t=trip();S.t.log.push([t.start,t.kind==='meet'?'Met friend at Central Park':'Shift started']);S.t.log.push([t.end,t.kind==='meet'?'Left Central Park':'Shift ended']);go('retstop')},
 afterRetStop:()=>{const t=trip();if(S.settings.problems&&t.offer){S.t.probs.push('Shift that may not match bus times');go('offer')}else ACT.toPhoneBack()},
 afterWrongBack:()=>{S.t.qa['retstop:rs']={k:'in',tries:1};const t=trip();if(S.settings.problems&&t.offer){S.t.probs.push('Shift that may not match bus times');go('offer')}else ACT.toPhoneBack()},
 toPhoneBack:()=>{const t=trip();S.t.backNow=t.end+((t.back&&t.back.walkBack)||t.walk);S.t.back=[];S.t.backIdx=0;S.t.ph={};S.t.pfb='';S.t.pdone=null;go('phoneBack')},
 finish:()=>{if(!S.done.includes(S.trip))S.done.push(S.trip);go('finish')},
 repeat:()=>newTrip(S.trip)
};
/* transfer screen leads to pay for leg 2; ride after pay uses legIdx */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act],[data-ch]');if(!el||el.disabled)return;
 if(el.dataset.ch){const [scr,qid,k]=el.dataset.ch.split('|');const qs=(CUR&&CUR.qs)||[];const nav=answer(scr,qid,k,qs);if(!nav){render();const card=document.getElementById('q-'+qid);const f=card&&card.querySelector('.feedback');if(f){f.scrollIntoView({block:'nearest'});live(f.textContent)}const nq=card&&card.nextElementSibling;if(nq&&nq.classList.contains('qcard')){const h2=nq.querySelector('h2');}}return}
 const a=el.dataset.act;if(ACT[a]){ACT[a](el.dataset.v,el)}});
/* ---------- helper / coach panel ---------- */
function openModal(html,label){const w=$('#modal');w.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="modal-card coach">${html}</div></div>`;w.classList.remove('hidden');openModal.prev=document.activeElement;const f=w.querySelector('button,select,a');if(f)f.focus()}
function closeModal(){const w=$('#modal');w.innerHTML='';w.classList.add('hidden');if(openModal.prev)try{openModal.prev.focus()}catch(e){}}
document.addEventListener('keydown',e=>{const w=$('#modal');if(w.classList.contains('hidden'))return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const f=[...w.querySelectorAll('button,select,a,summary,input')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function coach(){const st=S.settings;const opts=(c)=>TRIPS.filter(t=>t.city===c).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
 let h=`<h2>Helper settings</h2><p class="small muted">For job coaches and support staff. No names or personal information are collected. Progress is saved only on this device.</p>
 <div class="cgrid">
 <div class="cfield"><label for="cLevel">Practice level</label><select id="cLevel"><option value="guided"${st.level==='guided'?' selected':''}>Guided Practice (more hints)</option><option value="indep"${st.level==='indep'?' selected':''}>Independent Practice (fewer hints)</option></select></div>
 <div class="cfield"><label for="cProb">Problems during trips</label><select id="cProb"><option value="1"${st.problems?' selected':''}>On — include real-life problems</option><option value="0"${!st.problems?' selected':''}>Off — smooth trips</option></select></div>
 <div class="cfield"><label for="cDay">Day of the trip</label><select id="cDay"><option value="wk"${st.day==='wk'?' selected':''}>Weekday</option><option value="sat"${st.day==='sat'?' selected':''}>Saturday</option><option value="sun"${st.day==='sun'?' selected':''}>Sunday (practice "no service")</option></select></div>
 <div class="cfield"><label for="cRead">Read each screen aloud</label><select id="cRead"><option value="0"${!st.autoRead?' selected':''}>Only when the button is pressed</option><option value="1"${st.autoRead?' selected':''}>Automatically</option></select></div>
 </div><div class="btnrow"><button class="btn primary" data-m="saveSet">Save settings</button></div>
 <h3>Start a specific trip</h3><div class="cgrid"><div class="cfield"><label for="cTrip">City and destination</label><select id="cTrip"><optgroup label="Johnstown — CamTran">${opts('J')}</optgroup><optgroup label="Altoona — AMTRAN">${opts('A')}</optgroup></select></div></div>
 <div class="btnrow"><button class="btn secondary" data-m="startTrip">Start this trip</button>${S.trip?`<button class="btn secondary" data-m="restart">Restart current trip</button>`:''}<button class="btn secondary" data-m="home">Go to city choice</button></div>
 <h3>Completed trips on this device</h3><p class="small">${S.done.length?S.done.map(id=>esc(TRIPS.find(t=>t.id===id).name)).join('; '):'None yet.'}</p>
 <details><summary>Practice notes (first answers to review)</summary><ul>${S.notes.length?S.notes.slice(-40).map(n=>`<li>${esc(n)}</li>`).join(''):'<li>None yet.</li>'}</ul><button class="btn link" data-m="clearNotes">Clear notes</button></details>
 <details><summary>Skills practiced</summary><ul>${SKILLS.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>
 <details><summary>Sources (checked ${CHECKED})</summary><ul>${SOURCES.map(([n,u])=>`<li>${esc(n)}${u?` — <a href="${u}" target="_blank" rel="noopener">${esc(u)}</a>`:''}</li>`).join('')}</ul><p class="small">CamTran: ${esc(CITY.J.fare)} ${esc(CITY.J.payNote)} Phone ${CITY.J.phone} or ${CITY.J.phone2}; TDD ${CITY.J.relay}.<br>AMTRAN: ${esc(CITY.A.fare)} ${esc(CITY.A.payNote)} Phone ${CITY.A.phone} (${CITY.A.phoneHours}); myStop ${CITY.A.mystop}.</p></details>
 <details><summary>Needs real-world checking</summary><ul>${UNVERIFIED.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details>
 <details><summary>Destinations: included and left out</summary><ul>${TRIPS.map(t=>`<li><b>${esc(t.name)}</b> — ${esc(t.addr)}</li>`).join('')}${EXCLUDED.map(([a,b])=>`<li><b>Left out:</b> ${esc(a)} — ${esc(b)}</li>`).join('')}</ul></details>
 <details><summary>Photo credits</summary><ul>${Object.values(PHOTOS).map(p=>`<li>${esc(p.cap)} — ${esc(p.credit)}, ${esc(p.license)}, Wikimedia Commons: <a href="${p.url}" target="_blank" rel="noopener">${esc(p.file)}</a></li>`).join('')}<li>All other pictures are training illustrations drawn for this game. Business names are plain text, not logos.</li></ul></details>
 <details><summary>Clear saved data</summary><p class="small">Removes settings, progress and notes from this device.</p><button class="btn secondary" data-m="wipe">Clear all saved data</button></details>
 <div class="modal-actions"><button class="btn primary" data-m="close">Close</button></div>`;
 openModal(h,'Helper settings')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-m]');if(!el)return;const m=el.dataset.m;
 if(m==='close')return closeModal();
 if(m==='saveSet'){S.settings.level=$('#cLevel').value;S.settings.problems=$('#cProb').value==='1';S.settings.day=$('#cDay').value;S.settings.autoRead=$('#cRead').value==='1';save();closeModal();toast('Settings saved. New day settings apply to the next trip.');render();return}

$('#bHelp').addEventListener('click',coach);

if(!('speechSynthesis' in window)){$('#bRead').title='Read aloud is not supported on this device'}
if(S.step!=='city'&&(!S.t||!S.trip))S.step='city';
