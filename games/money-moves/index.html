<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Money Moves</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1c2533; --muted:#4a5565; --line:#dfe5ec;
  --pri:#0f766e; --pri-d:#0a5550; --pri-l:#e3f3f1;
  --good:#146c35; --good-l:#e6f5eb; --bad:#a3221a; --bad-l:#fdecea; --warn:#7a3d00; --warn-l:#fff4dc; --blue:#1d4ed8; --blue-l:#e8efff;
  --r:20px; --sh:0 4px 16px rgba(20,30,50,.08), 0 1px 3px rgba(20,30,50,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus{outline:none}
:focus-visible{outline:4px solid #f59e0b !important;outline-offset:3px}
h1{font-size:28px;line-height:1.2;margin:4px 0 8px}
h1:focus{outline:none}
h2{font-size:22px;line-height:1.25;margin:0 0 10px}
p{margin:0 0 10px}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:#fff;padding:12px 18px;border-radius:12px;font-weight:800}
.skip:focus{left:8px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top));background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--pri-d);min-width:0}
.brand-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-av{width:40px;height:40px;flex:0 0 40px}
.hdr-av svg{width:40px;height:40px;display:block}
.top-actions{display:flex;gap:8px;align-items:center}
.tbtn{min-height:52px;min-width:52px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tbtn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.gear{width:52px;height:52px;border:none;background:transparent;font-size:24px;color:#6b7684;border-radius:12px;padding:0}
.progress{display:flex;gap:6px;padding:10px 16px 0;max-width:900px;margin:0 auto}
.pstep{flex:1;text-align:center;font-size:14px;color:#5b6676;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstep .pb{height:7px;border-radius:7px;background:#d9e0e8;margin-bottom:4px}
.pstep.done .pb{background:#8ccbc3}
.pstep.cur .pb{background:var(--pri)}
.pstep.cur{color:var(--pri-d)}
.screen{max-width:900px;margin:0 auto;padding:8px 16px 20px}
.anim{animation:fadeUp .25s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(15,118,110,.45)}100%{box-shadow:0 0 0 12px rgba(15,118,110,0)}}
.eyebrow{font-size:15px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 0}
.lead{font-size:19px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:12px 0}
.center{text-align:center}
.actions{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:6px;background:linear-gradient(rgba(243,245,249,0),var(--bg) 30%)}
.actions .sp{flex:1}
.btn{min-height:58px;padding:0 24px;border-radius:16px;border:2px solid transparent;font-weight:800;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh);text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--pri);color:#fff}
.btn.secondary{background:#fff;border-color:#c9d3de;color:var(--ink)}
.btn.good{background:var(--good);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.big{min-height:68px;font-size:22px;padding:0 30px}
.btn.link{background:none;box-shadow:none;color:var(--pri-d);text-decoration:underline;min-height:52px;padding:0 10px;font-size:17px}
.btn[disabled]{background:#e4e8ee;color:#5f6a7a;box-shadow:none;cursor:not-allowed;transform:none;border-color:transparent}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.label{display:block;font-size:21px;font-weight:800;margin-bottom:6px}
.input{width:100%;min-height:58px;font-size:22px;padding:8px 16px;border-radius:14px;border:2px solid #b9c5d3;background:#fbfcfe}
.input:focus{border-color:var(--pri)}
/* choices */
.choices{display:grid;gap:12px;margin:14px 0;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.choices.one{grid-template-columns:1fr}
.choice{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 16px;min-height:64px;width:100%;font-weight:700}
.choice .ci{font-size:34px;line-height:1;flex:0 0 auto}
.choice .ct{flex:1;min-width:0}
.choice .ct b{display:block;font-size:20px}
.choice .ct span{display:block;font-size:16px;font-weight:600;color:var(--muted)}
.choice .cm{font-size:20px;font-weight:800;color:var(--pri-d);white-space:nowrap}
.choice.sel{border-color:var(--pri);background:var(--pri-l)}
.choice.sel::after{content:"✓";position:absolute;top:-12px;right:12px;background:var(--pri);color:#fff;font-weight:800;border-radius:999px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px}
.choice[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.feedback{border-radius:16px;padding:14px 16px;font-size:18px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
.feedback .fi{font-size:26px;line-height:1}
.feedback.good{background:var(--good-l);color:#0e4d27}
.feedback.tip{background:var(--blue-l);color:#1b3a8a}
.feedback.warn{background:var(--warn-l);color:var(--warn)}
/* avatars */
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.av{border-radius:20px;border:3px solid var(--line);background:#fff;padding:6px;aspect-ratio:1/1}
.av svg{width:100%;height:100%;display:block}
.av.sel{border-color:var(--pri);background:var(--pri-l);box-shadow:0 0 0 4px rgba(15,118,110,.18)}
/* jobs */
.jobs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin:14px 0}
.job{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;width:100%;position:relative}
.job.sel{border-color:var(--pri);background:var(--pri-l)}
.job.sel::after{content:"✓ Chosen";position:absolute;top:-13px;right:14px;background:var(--pri);color:#fff;font-weight:800;font-size:15px;padding:3px 12px;border-radius:999px}
.job .jh{display:flex;gap:12px;align-items:center}
.job .ji{width:64px;height:64px;flex:0 0 64px}
.job .ji svg{width:64px;height:64px;display:block}
.job .jt{display:block;font-size:20px;font-weight:800;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.job .jd{display:block;font-size:16px;color:var(--muted);font-weight:600}
.job .jp{display:block;font-size:24px;font-weight:800;color:var(--pri-d)}
.job .jp small{font-size:16px;color:var(--muted)}
.job .jf{display:block;font-size:17px;font-weight:600}
.job .jf span{display:block;padding:1px 0}
/* money strip */
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mt{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:8px 10px;min-width:0}
.mt .l{display:block;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mt .v{display:block;font-size:21px;font-weight:800;white-space:nowrap}
.mt.ck{border-top:5px solid var(--pri)}.mt.sv{border-top:5px solid #16a34a}.mt.bl{border-top:5px solid #d97706}
.mt.hl{animation:glow .9s ease-out}
.change{background:#fff;border:3px solid #9fd5ce;border-radius:16px;padding:12px 16px;margin:10px 0;font-size:19px;font-weight:700}
.change .amt{font-size:24px;font-weight:800}
.change .row{display:block;margin-top:2px}
.amt-in{color:var(--good)} .amt-out{color:var(--bad)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.wk{border-radius:16px;background:#fff;border:3px solid var(--line);padding:8px 6px;text-align:center;min-height:96px;position:relative}
.wk b{display:block;font-size:17px}
.wk .wi{display:block;font-size:15px;font-weight:700;color:var(--muted);line-height:1.3}
.wk.cur{border-color:var(--pri);background:var(--pri-l);box-shadow:0 0 0 3px rgba(15,118,110,.2)}
.wk.done{background:#eef7f5}
.wk .tick{position:absolute;top:-12px;right:-6px;width:36px;height:36px;border-radius:50%;background:var(--good);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.wk.done .wi{opacity:.65}
/* lists */
.lines{margin:6px 0 0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:18px}
.lines li:last-child{border-bottom:none}
.lines li.total{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
.lines li.paid{color:var(--good)}
.big-money{font-size:34px;font-weight:800;line-height:1.15}
.stub{border:3px dashed #9fcfbf;border-radius:18px;background:#fbfffd;padding:14px 16px}
.stub .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:18px;border-bottom:1px dotted #cfe3da}
.stub .row > :last-child{white-space:nowrap;text-align:right}
.stub .row:last-child{border-bottom:none}
.stub .net{font-size:28px;font-weight:800;color:var(--good)}
.plan h2{font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--pri-d);margin:0 0 4px}
.planleft{text-align:center;border-radius:18px;padding:14px;background:var(--good-l);color:var(--good)}
.planleft.no{background:var(--bad-l);color:var(--bad)}
.event{border:3px solid #f2c46d;background:#fffaf0}
.event.goodev{border-color:#8fd3aa;background:#f6fcf8}
.event .eh{display:flex;gap:14px;align-items:center}
.event .ei{font-size:48px;line-height:1}
.tag{display:inline-block;font-size:14px;font-weight:800;padding:2px 10px;border-radius:999px;background:#f9dd9f;color:#6b3a00}
.goodev .tag{background:#c9ecd6;color:#0e4d27}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px;text-align:center}
.stat .sl{font-size:16px;font-weight:700;color:var(--muted)}
.stat .sv{font-size:24px;font-weight:800}
.tips{list-style:none;padding:0;margin:0}
.tips li{padding:8px 0;font-size:18px;border-bottom:1px solid var(--line)}
.tips li:last-child{border-bottom:none}
.hero-av{width:110px;height:110px;margin:0 auto}
.hero-av svg{width:110px;height:110px}
/* modal & coach */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,23,35,.5);display:flex;align-items:center;justify-content:center;padding:14px}
.modal-card{background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px;max-width:560px;width:100%;max-height:calc(100vh - 28px);overflow:auto}
.modal-card.wide{max-width:860px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.coach h3{border-top:1px solid var(--line);padding-top:14px;font-size:20px}
.coach details{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:8px 0}
.coach summary{min-height:52px;display:flex;align-items:center;font-weight:800;font-size:18px;cursor:pointer}
.crow{display:flex;align-items:center;gap:12px;min-height:52px;font-size:17px;padding:4px 0}
.crow input{width:28px;height:28px;accent-color:var(--pri);flex:0 0 28px}
.cgrid{display:grid;align-items:end;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;padding-bottom:8px}
.cfield label{display:block;font-size:15px;font-weight:700;color:var(--muted)}
.cfield input,.cfield select{width:100%;min-height:50px;font-size:18px;padding:6px 10px;border:2px solid #b9c5d3;border-radius:12px;background:#fff}
.txt{width:100%;border-collapse:collapse;font-size:17px}
.txt th,.txt td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.txt td.n{text-align:right;white-space:nowrap;font-weight:800}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2a37;color:#fff;font-size:18px;font-weight:600;padding:12px 20px;border-radius:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:160;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
@media (max-width:600px){
  body{font-size:18px}
  h1{font-size:24px}
  .tbtn span{display:none}
  .tbtn{padding:0 10px}
  .brand{font-size:17px;gap:8px}
  .top-actions{gap:4px}
  .pstep{font-size:0}
  .screen{padding:6px 12px 16px}
  .card{padding:14px}
  .btn{font-size:18px;padding:0 16px}
  .actions .btn{flex:1 1 auto}
  .jobs,.choices{grid-template-columns:1fr}
  .mt .v{font-size:18px}
  .mt .l{font-size:12px}
  .wk{min-height:88px;padding:6px 3px}
  .wk b{font-size:15px}
  .wk .wi{font-size:12px}
  .avatars{grid-template-columns:repeat(4,1fr);gap:8px}
}
@media (max-width:420px){
  .brand{gap:6px}
  .hdr-av,.hdr-av svg{width:32px;height:32px;flex:0 0 32px}
  .brand-t{white-space:normal;overflow:visible;text-overflow:clip;font-size:16px;line-height:1.1}
}
</style>
</head>

<script>
(function(){
'use strict';
var LS_STATE = 'crbMoneyMonth.state.v3', LS_SET = 'crbMoneyMonth.settings.v3';
var STD_BIWEEKLY = Math.round(1610000 / 26); // 2026 standard deduction / 26 paychecks (simple federal estimate)
var DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ---------- Jobs: exact days and start times. End time = start + weekly hours / number of days. ---------- */
var JOBS = [
  {id:'stocker', title:'Grocery stocker', duties:'Stock shelves and organize products', rate:16.25, hours:20, days:[0,1,2,3,4], start:6, dist:{city:4, rural:9}, carpool:true,
   attire:'clean work clothes and closed-toe shoes'},
  {id:'package', title:'Package handler', duties:'Load, unload, and sort boxes', rate:18.50, hours:25, days:[0,1,2,3,4], start:4, dist:{city:7, rural:16}, carpool:true,
   attire:'clean jeans or work pants, a plain shirt, and sturdy shoes'},
  {id:'dietary', title:'Dietary aide', duties:'Set up meal trays and serve residents at a nursing home', rate:15.75, hours:24, days:[0,2,4,5], start:6, dist:{city:3, rural:11}, carpool:true,
   attire:'clean, neat clothes and non-slip shoes'},
  {id:'dish', title:'Dishwasher', duties:'Wash dishes and keep the restaurant kitchen clean', rate:14.00, hours:24, days:[3,4,5,6], start:16, dist:{city:2, rural:8}, carpool:false,
   attire:'clean, neat clothes and non-slip shoes'},
  {id:'retail', title:'Retail associate', duties:'Fold clothes, stock racks, and help customers', rate:13.50, hours:20, days:[1,2,5,6], start:12, dist:{city:2.5, rural:12}, carpool:false,
   attire:'neat, clean clothes, like a polo shirt or blouse and pants'},
  {id:'fastfood', title:'Fast-food crew member', duties:'Take orders and prepare food', rate:12.00, hours:16, days:[0,1,4,5], start:11, dist:{city:1, rural:3}, carpool:false,
   attire:'clean, simple clothes and non-slip shoes'},
  {id:'janitor', title:'Janitorial worker', duties:'Clean offices, empty trash, and mop floors', rate:14.50, hours:20, days:[0,1,2,3,4], start:17, dist:{city:1.5, rural:10}, carpool:true,
   attire:'clean, comfortable work clothes and sturdy shoes'},
  {id:'cashier', title:'Cashier', duties:'Ring up sales and stock coolers at a convenience store', rate:13.75, hours:30, days:[2,3,4,5,6], start:14, dist:{city:0.8, rural:1}, carpool:false,
   attire:'neat, clean clothes'}
];
var DEFAULT_SETTINGS = {
  mode:'standard', events:'normal', startChecking:100, startSavings:100,
  transit:{city:{bus:true, evenings:false, weekends:true, shared:true}, rural:{bus:false, evenings:false, weekends:false, shared:true}},
  other:{ssi:0, ssdi:0, other:0, family:0},

  costs:{famCity:200, famRural:200, roomCity:400, roomRural:325, ownCity:700, ownRural:575, elecRoom:50, elecOwn:80, phone:45, groceries:300, personal:20,
    dogCare:60, catCare:45, petRent:25, meds:10, bus:55, rides:40, carpool:50, sharedCity:60, sharedRural:80,
    carPay:250, carIns:120, carInsOld:100, gasCity:100, gasRural:150, upkeep:40}
};
var COST_LABELS = [
  ['🏠 Housing', [['famCity','Live with family, city or town'],['famRural','Live with family, rural'],['roomCity','Roommate rent, city or town'],['roomRural','Roommate rent, rural'],['ownCity','Own apartment rent, city or town'],['ownRural','Own apartment rent, rural'],['elecRoom','Electric, roommate share'],['elecOwn','Electric, own apartment']]],
  ['📱 Phone, food, and medicine', [['phone','Phone bill (if the player has a phone plan)'],['groceries','Groceries for the month'],['personal','Personal and household items (Standard mode)'],['meds','Medicine copay (if the player has one)']]],
  ['🐾 Pets', [['dogCare','Dog food and care'],['catCare','Cat food and care'],['petRent','Pet rent (when renting)']]],
  ['🚌 Transportation', [['bus','Bus pass'],['rides','Gas money for rides'],['carpool','Carpool share'],['sharedCity','Shared-ride service, city or town'],['sharedRural','Shared-ride service, rural'],['carPay','Car payment (car loan)'],['carIns','Car insurance (newer car)'],['carInsOld','Car insurance (older car)'],['gasCity','Gas, city or town'],['gasRural','Gas, rural'],['upkeep','Car maintenance']]]
];

/* ---------- Helpers ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
var FMT = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits:2});
function C(d){ return Math.round(Number(d) * 100) || 0; }
function money(c){ c = Math.round(c) || 0; return FMT.format(c / 100); }
function sum(a, f){ var s = 0; a.forEach(function(x){ s += f ? f(x) : x; }); return s; }
function find(a, f){ for (var i = 0; i < a.length; i++) if (f(a[i])) return a[i]; return null; }
function num(n){ return String(Math.round(n * 100) / 100); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

var rng = Math.random;
function rand(){ return rng(); }
function pick(a){ return a[Math.floor(rand() * a.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function timeStr(h){ var hr = Math.floor(h + 1e-9), m = Math.round((h - hr) * 60); if (m === 60){ hr++; m = 0; } hr = hr % 24; var ap = hr >= 12 ? 'PM' : 'AM', h12 = hr % 12 === 0 ? 12 : hr % 12; return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; }
function hoursWord(h){ return num(h) + (h === 1 ? ' hour' : ' hours'); }
function daysStr(days){
  var d = days.slice().sort(function(a, b){ return a - b; }), consecutive = d.length > 2 && d[d.length - 1] - d[0] === d.length - 1;
  if (consecutive) return DAY_NAMES[d[0]] + '–' + DAY_NAMES[d[d.length - 1]];
  var n = d.map(function(i){ return DAY_NAMES[i]; });
  return n.length <= 2 ? n.join(' and ') : n.slice(0, -1).join(', ') + ', and ' + n[n.length - 1];
}

/* ---------- Settings (job coach) ---------- */
function okNum(v, lo, hi){ return typeof v === 'number' && isFinite(v) && v >= lo && v <= hi; }
// Weekly hours must split evenly into the job's days, in half-hour steps, 2 to 10 hours a shift.
function snapHours(h, nDays){ var shift = Math.round((h / nDays) * 2) / 2; shift = Math.max(2, Math.min(10, shift)); return shift * nDays; }
function mergeSettings(s){
  var d = clone(DEFAULT_SETTINGS); if (!s) return d;
  if (s.mode === 'easy' || s.mode === 'standard') d.mode = s.mode;
  if (['none','fewer','normal','more'].indexOf(s.events) >= 0) d.events = s.events;
  if (okNum(s.startChecking, 0, 5000)) d.startChecking = Math.round(s.startChecking * 100) / 100;
  if (okNum(s.startSavings, 0, 5000)) d.startSavings = Math.round(s.startSavings * 100) / 100;
  ['city','rural'].forEach(function(a){ if (s.transit && s.transit[a]) ['bus','evenings','weekends','shared'].forEach(function(k){ if (typeof s.transit[a][k] === 'boolean') d.transit[a][k] = s.transit[a][k]; }); });
  if (s.other) ['ssi','ssdi','other','family'].forEach(function(k){ if (okNum(s.other[k], 0, 5000)) d.other[k] = Math.round(s.other[k] * 100) / 100; });
  if (s.jobs && s.jobs.forEach) d.jobs.forEach(function(j){
    var o = find(s.jobs, function(x){ return x && x.id === j.id; }), base = find(JOBS, function(x){ return x.id === j.id; });
    if (o){ if (okNum(o.rate, 1, 100)) j.rate = Math.round(o.rate * 100) / 100; if (okNum(o.hours, 1, 70)) j.hours = snapHours(o.hours, base.days.length); }
  });
  if (s.costs) Object.keys(d.costs).forEach(function(k){ if (okNum(s.costs[k], 0, 5000)) d.costs[k] = Math.round(s.costs[k] * 100) / 100; });
  return d;
}
var settings = mergeSettings(load(LS_SET));
function easy(){ return settings.mode === 'easy'; }
function cost(k){ return C(settings.costs[k]); }

/* ---------- Game state ---------- */

    area:null, home:null, pets:null, phone:null, license:null, ownsCar:null, carPaid:null, meds:null,
    jobId:null, tried:[], prep:{}, iq:0, ians:{}, transport:null, other:clone(settings.other), saveGoal:2500, sim:null,

}

/* ---------- Jobs and pay ---------- */
function getJob(id){
  var base = find(JOBS, function(j){ return j.id === id; }); if (!base) return null;
  var o = clone(base), s = find(settings.jobs, function(j){ return j.id === id; });
  if (s){ o.rate = s.rate; o.hours = s.hours; }
  o.shift = o.hours / o.days.length; o.end = o.start + o.shift;
  o.daysText = daysStr(o.days); o.timeText = timeStr(o.start) + '–' + timeStr(o.end);
  return o;
}
function allJobs(){ return JOBS.map(function(j){ return getJob(j.id); }); }
function currentJob(){ return state.jobId ? getJob(state.jobId) : null; }
function paycheckFor(job, hours){
  hours = Math.max(0, hours);
  var gross = Math.round(job.rate * 100 * hours), lines;
  if (easy()){
    lines = [{label:'Taxes and deductions (about 12%)', c:Math.round(gross * 0.12)}];
  } else {
    lines = [
      {label:'Federal income tax (estimate)', c:Math.max(0, Math.round((gross - STD_BIWEEKLY) * 0.10))},
      {label:'Social Security and Medicare (7.65%)', c:Math.round(gross * 0.0765)},
      {label:'Pennsylvania income tax (3.07%)', c:Math.round(gross * 0.0307)},
      {label:'Local earned income tax (1%)', c:Math.round(gross * 0.01)}
    ];
  }
  var taxes = sum(lines, function(l){ return l.c; });
  return {hours:hours, rate:job.rate, gross:gross, lines:lines, taxes:taxes, net:gross - taxes};
}
function stdPay(job){ return paycheckFor(job, job.hours * 2); }

/* ---------- Transportation ---------- */
var REL = {high:{icon:'✅', word:'Dependable'}, ok:{icon:'👍', word:'Usually works'}, low:{icon:'⚠️', word:'Can be hard'}};
function L(label, c, due){ return {label:label, c:c, due:due}; }
function halves(c){ var a = Math.floor(c / 2); return [a, c - a]; }
function transportInfo(job, area){
  area = area || state.area || 'city';
  var t = settings.transit[area], dist = job.dist[area], early = job.start < 6, late = job.end > 21, dark = job.start < 6 || job.end > 20;
  var weekend = job.days.some(function(d){ return d >= 5; }), opts = [], notes = [];
  var R = area === 'rural' ? 'Rural' : 'City';
  if (dist <= 1.5) opts.push({id:'walk', icon:'🚶', name:'Walk', why: dark ? 'Close by, but you walk in the dark.' : 'Close by.', rel: dark ? 'ok' : 'high', lines:[]});
  else notes.push('Walking: the job is ' + num(dist) + ' miles away.');
  var busEnd = t.evenings ? 23 : 19;
  if (!t.bus) notes.push('Bus: there is no public bus where you live.');
  else if (job.start < 6) notes.push('Bus: buses do not run before 6:00 AM.');
  else if (job.end > busEnd) notes.push('Bus: the last bus leaves before ' + timeStr(job.end) + '.');
  else if (weekend && !t.weekends) notes.push('Bus: buses do not run on weekends.');
  else opts.push({id:'bus', icon:'🚌', name:'Public bus', why: job.end > 19 ? 'Evening buses come less often.' : 'A bus stops near the job.', rel: job.end > 19 ? 'ok' : 'high', lines:[L('Bus pass', cost('bus'), 1)]});
  opts.push({id:'rides', icon:'🚙', name:'Rides from family or friends', why: early || late ? 'Hard to find a ride that early or late every time.' : 'Works when their schedule matches yours.', rel: early || late ? 'low' : 'ok', lines:[L('Gas money for rides', cost('rides'), 1)]});
  if (job.carpool) opts.push({id:'carpool', icon:'🧑‍🤝‍🧑', name:'Carpool with a coworker', why:'A coworker drives. You help pay for gas.', rel:'ok', lines:[L('Carpool share', cost('carpool'), 1)]});
  if (t.shared){
    if (job.start >= 6 && job.end <= 21) opts.push({id:'shared', icon:'🚐', name:'Shared-ride van', why:'You must book each ride a day ahead.', rel:'ok', lines:[L('Shared-ride trips', cost('shared' + R), 1)]});
    else notes.push('Shared-ride van: it does not run that early or late.');
  }
  if (!state.license) notes.push('Driving: you need a driver\u2019s license to drive.');
  else if (!state.ownsCar) notes.push('Driving: you have a license but no car right now. Some people save up to buy a car.');
  else {
    var gas = halves(cost('gas' + R));
    if (state.carPaid) opts.push({id:'carOld', icon:'🚗', name:'Drive my car (paid off)', why:'No car payment. Older cars can need repairs.', rel:'ok',
      lines:[L('Car insurance', cost('carInsOld'), 1), L('Gas', gas[0], 1), L('Gas', gas[1], 3), L('Car maintenance', cost('upkeep'), 3)]});
    else opts.push({id:'carLoan', icon:'🚘', name:'Drive my car (with car payments)', why:'Newer car. You make a monthly car payment.', rel:'high',
      lines:[L('Car insurance', cost('carIns'), 1), L('Gas', gas[0], 1), L('Car payment', cost('carPay'), 3), L('Gas', gas[1], 3), L('Car maintenance', cost('upkeep'), 3)]});
  }
  opts.forEach(function(o){ o.cost = sum(o.lines, function(l){ return l.c; }); });
  return {opts:opts, notes:notes};
}

  if (state.home === 'roommate'){ rent('Rent (your share)', cost('room' + R)); b.push({icon:'💡', label:'Electric (your share)', c:cost('elecRoom'), due:3}); }

  if (!easy()) b.push({icon:'🧴', label:'Personal and household items', c:cost('personal'), due:3});
  var t = transportOpt(); if (t) t.lines.forEach(function(l){ b.push({icon: usesCar() ? '🚗' : (t.icon || '🚌'), label:l.label, c:l.c, due:l.due}); });
  return b.filter(function(x){ return x.c > 0; }).map(function(x){ var li = lateInfo(x.label); x.late = li[0]; x.lateFee = C(li[1] || 0); x.feeText = li[2] || ''; x.prio = li[3]; return x; });
}
// What happens if a bill is late (kept from v2): fee | family | carry | pause | risk
var LATE_TEXT = {

function lateInfo(label){

// Other income arrives in the same weeks as in v2: SSI Week 1, SSDI Week 2, other Week 3, family help Week 1.
var OTHER = [{k:'ssi', label:'SSI', week:1, kind:'benefit'}, {k:'ssdi', label:'SSDI', week:2, kind:'benefit'}, {k:'other', label:'Other money', week:3, kind:'other'}, {k:'family', label:'Help from family', week:1, kind:'family'}];
function otherIncome(){ var o = state.other || {}; return OTHER.map(function(x){ return {k:x.k, label:x.label, week:x.week, kind:x.kind, c: easy() ? C(Math.round(Number(o[x.k]) || 0)) : C(o[x.k] || 0)}; }).filter(function(x){ return x.c > 0; }); }
function plan(){
  var j = currentJob(), pc = stdPay(j), bills = monthBills(), other = otherIncome();
  var p = {pay:pc.net, wages:pc.net * 2, other:other, otherTotal:sum(other, function(x){ return x.c; }), bills:bills, billsTotal:sum(bills, function(x){ return x.c; }),

/* =====================================================================
   The month (v2 engine, kept and simplified on screen).
   Every money change goes through txn() and is written to the ledger.
   ===================================================================== */
function S_(){ return state.sim; }
function txn(from, to, c, kind, label, ref){
  var s = S_(); c = Math.round(c);
  if (!(c > 0)) return false;
  if (from !== 'world' && s[from] < c) return false;
  if (from !== 'world') s[from] -= c;
  if (to !== 'world') s[to] += c;
  s.ledger.push({n:s.ledger.length + 1, w:s.week, from:from, to:to, c:c, kind:kind, label:label, ref:ref || null});
  return true;
}
function addNote(kind, text){ var a = S_().notes[kind]; if (a.indexOf(text) < 0) a.push(text); }
function trackLow(){ var s = S_(); if (s.low == null || s.checking < s.low) s.low = s.checking; }
// Pay from checking first, then savings for the rest (only when needed).
function spend(c, kind, label, ref){
  var s = S_(); if (c <= 0) return true; if (s.checking + s.savings < c) return false;
  var a = Math.min(s.checking, c), b = c - a;
  if (a) txn('checking', 'world', a, kind, label, ref);
  if (b){ txn('savings', 'world', b, kind, label + ' (from savings)', ref); s.usedSavings += b; }
  return true;
}
// Group money moves so the screen can show "Checking $A → $B".
function op(text, fn){
  var s = S_(), c0 = s.checking, s0 = s.savings, ok = fn();
  if (ok === false) return false;
  s.fx = {key: stepKey(), text: typeof text === 'function' ? text() : text, ck:[c0, s.checking], sv:[s0, s.savings]};
  trackLow();
  return true;
}
function stepKey(){ var s = S_(); return s.week + '.' + s.step; }
function curStep(){ var s = S_(); return s.steps[s.week][s.step]; }
function owed(b){ return b.c + b.fee - b.paidAmt; }
function billsLeft(){ return sum(S_().bills.filter(function(b){ return b.due <= 4; }), owed); }
function billsDueNow(){ var s = S_(); return s.bills.filter(function(b){ return owed(b) > 0 && b.due <= s.week; }).sort(function(a, b){ return a.prio - b.prio; }); }
function otherFor(w){ return otherIncome().filter(function(x){ return x.week === w; }); }

function startMonth(){
  var seed = Number(urlParam('seed')) || (Date.now() % 2147483647);
  rng = mulberry32(seed);
  var j = currentJob(), p = plan();
  var s = {seed:seed, week:1, step:0, checking:C(settings.startChecking), savings:C(settings.startSavings), ledger:[], fx:null, done:{}, evRes:{},
    hoursLost:0, hoursExtra:0, schedVar:0, hourNotes:[], grocDiscount:0, usedSavings:0, paidBack:0, lateNotes:[], notes:{good:[], hard:[]}, finished:false,
    saveGoal:state.saveGoal, groc:p.groceries, low:null, owe:0};
  s.payHoursBase = j.hours; s.rate = j.rate; s.startChecking = s.checking; s.startSavings = s.savings;
  s.bills = monthBills().map(function(b, i){ return {id:'b' + (i + 1), icon:b.icon, label:b.label, c:b.c, due:b.due, origDue:b.due, rent:!!b.rent, late:b.late, lateFee:b.lateFee, feeText:b.feeText, prio:b.prio, paidAmt:0, fee:0, lateApplied:false, arranged:false, paidWeek:0}; });
  state.sim = s;
  var pool = shuffle(WANTS.map(function(w){ return w.id; }));
  s.wants = {2:pool[0], 4:pool[1]};
  // Standard mode: the posted schedule can change a little (kept from v2). It changes the Week 3 paycheck.
  if (!easy()){ var v = shuffle([-3, 0, 0, 2])[0]; if (v){ var b0 = paycheckFor({rate:s.rate}, s.payHoursBase * 2).net; s.schedVar = v; s.hourNotes.push({k:'sched', h:v, d:Math.abs(b0 - paycheckFor({rate:s.rate}, s.payHoursBase * 2 + v).net)}); } }
  s.events = genEvents();
  var ev = function(w){ return s.events.filter(function(e){ return e.w === w; }).map(function(e){ return {t:'event', k:e.k}; }); };
  var oth = function(w){ return otherFor(w).length ? [{t:'other', w:w}] : []; };
  s.steps = {1:[{t:'payday', n:1}].concat(oth(1), [{t:'bills'}, {t:'save'}]),
    2:oth(2).concat([{t:'groc', n:1}, {t:'want'}], ev(2)),
    3:[{t:'payday', n:2}].concat(oth(3), [{t:'bills'}, {t:'save'}]),
    4:[{t:'groc', n:2}, {t:'want'}].concat(ev(4), [{t:'finish'}])};

}
function stepReady(st){
  var s = S_();
  if (st.t === 'payday') return !!s.done['pay' + st.n];
  if (st.t === 'other') return !!s.done['other' + st.w];
  if (st.t === 'bills') return !!s.done['bills' + s.week] || !billsDueNow().length;
  if (st.t === 'save') return !!s.done['save' + s.week];
  if (st.t === 'groc') return !!s.done['groc' + st.n];
  if (st.t === 'want') return !!s.done['want' + s.week];
  if (st.t === 'event') return !!s.evRes[st.k];
  if (st.t === 'finish') return !!s.done.finish;
  return true;
}

/* ---------- Paychecks ---------- */
function payHours(n){ var s = S_(); return n === 1 ? s.payHoursBase * 2 : Math.max(0, s.payHoursBase * 2 + s.schedVar - s.hoursLost + s.hoursExtra); }
function payFor(n){ return paycheckFor({rate:S_().rate}, payHours(n)); }
function depositPay(n){
  var s = S_(); if (s.done['pay' + n]) return false;
  var pc = payFor(n);
  return op('+' + money(pc.net), function(){ s.done['pay' + n] = pc; return txn('world', 'checking', pc.net, 'pay', 'Paycheck ' + n, 'pay' + n); });
}
function depositOther(w){
  var s = S_(); w = Number(w); if (s.done['other' + w]) return false; var xs = otherFor(w); if (!xs.length) return false;
  return op('+' + money(sum(xs, function(x){ return x.c; })), function(){ s.done['other' + w] = true; xs.forEach(function(x){ txn('world', 'checking', x.c, 'other', x.label, 'other_' + x.k); }); return true; });
}

/* ---------- Bills ---------- */
function payOne(b, amt, fromSavingsOk){
  var s = S_(); if (amt <= 0) return false;
  if (fromSavingsOk){ if (!spend(amt, 'bill', b.label, b.id)) return false; }
  else if (!txn('checking', 'world', amt, 'bill', b.label, b.id)) return false;
  b.paidAmt += amt; b.paidWeek = s.week; return true;
}
// mode: 'all' (checking covers it) | 'savings' (use savings for the rest) | 'plan' (pay what I can + payment plan for one bill) | 'cando'
function payBillsNow(mode){
  var s = S_(), due = billsDueNow(), key = 'bills' + s.week; if (s.done[key] || !due.length) return false;
  var total = sum(due, owed);
  if (mode === 'all' && s.checking < total) return false;
  if (mode === 'savings' && s.checking + s.savings < total) return false;
  var c0 = s.checking + s.savings, arranged = null;
  var ok = op('', function(){
    due.forEach(function(b){
      var amt = owed(b);
      if (mode === 'all' || mode === 'savings'){ payOne(b, amt, mode === 'savings'); return; }
      if (s.checking >= amt){ payOne(b, amt, false); return; }
      if (mode === 'plan' && !arranged && b.late !== 'risk'){ var half = Math.round(amt / 2); if (s.checking >= half && half > 0){ payOne(b, half, false); b.arranged = true; b.due = s.week < 3 ? 3 : 5; arranged = b;
        addNote('good', 'You called about ' + b.label.toLowerCase() + ' and set up a payment plan instead of skipping it.'); } }
    });
    s.done[key] = {mode:mode, arranged: arranged ? arranged.id : null}; return true;
  });
  if (ok) s.fx.text = 'You paid ' + money(c0 - s.checking - s.savings) + '.';
  return ok;
}
function canArrange(){ var s = S_(); var due = billsDueNow(), left = s.checking; for (var i = 0; i < due.length; i++){ var a = owed(due[i]); if (left >= a){ left -= a; continue; } return due[i].late !== 'risk' && left >= Math.round(a / 2) && Math.round(a / 2) > 0 ? due[i] : null; } return null; }
function lateMsg(b){
  if (b.late === 'fee') return b.label + ' was late. ' + (b.feeText ? b.feeText + ': +' + money(b.lateFee) + '.' : 'A ' + money(b.lateFee) + ' late fee was added.');
  return b.label + ' was late. ' + LATE_TEXT[b.late];
}
function endWeek(w){
  var s = S_(); if (s.done['end' + w]) return; s.done['end' + w] = true;
  s.bills.forEach(function(b){
    if (owed(b) > 0 && b.due <= w && !b.lateApplied){
      b.lateApplied = true; if (b.late === 'fee') b.fee += b.lateFee;
      s.lateNotes.push(lateMsg(b));
      if (w < 3) b.due = 3;
    }
  });
  if (w === 4) s.bills.forEach(function(b){ if (owed(b) > 0 && b.due <= 4) s.lateNotes.push(b.label + ': ' + money(owed(b)) + ' is still not paid.'); });
}

/* ---------- Savings, groceries, wants, finish ---------- */
function saveAmount(c){
  var s = S_(), key = 'save' + s.week; if (s.done[key]) return false; c = Number(c);
  if (c === 0){ s.done[key] = {c:0}; s.fx = {key:stepKey(), text:'You saved $0.00.', ck:[s.checking, s.checking], sv:[s.savings, s.savings]}; return true; }
  if (s.checking < c) return false;
  return op('You saved ' + money(c) + '.', function(){ s.done[key] = {c:c}; return txn('checking', 'savings', c, 'save', 'Moved to savings', key); });
}
// Put back money that was used from savings (kept from v2 "replace savings").
function payBackSavings(){
  var s = S_(), key = 'save' + s.week, c = Math.min(s.usedSavings - s.paidBack, s.checking); if (s.done[key] || c <= 0) return false;
  return op('You put ' + money(c) + ' back in savings.', function(){ s.done[key] = {c:c, back:true}; s.paidBack += c; addNote('good', 'You put money back into savings after using it.'); return txn('checking', 'savings', c, 'save', 'Put back in savings', key); });
}
function grocPlan(n){ var s = S_(), half = Math.floor(s.groc / 2), base = n === 1 ? half : s.groc - half; return Math.max(0, base - (n === 2 ? s.grocDiscount : 0)); }

}
function buyGroceries(n, id){

  if (id === 'pantry') return op('You got food from a food pantry. You spent $0.00.', function(){ s.done[key] = {id:id, c:0, plan:grocPlan(n)}; return true; });

/* ---------- Invariants (used by automated tests) ---------- */
function invariants(){
  var s = S_(), e = []; if (!s) return e;
  function chk(c, m){ if (!c) e.push(m); }
  var ck = s.startChecking, sv = s.startSavings;
  s.ledger.forEach(function(t){
    chk(Number.isInteger(t.c) && t.c > 0, 'bad amount #' + t.n); chk(t.from !== t.to, 'self transfer #' + t.n);
    if (t.from === 'checking') ck -= t.c; if (t.to === 'checking') ck += t.c; if (t.from === 'savings') sv -= t.c; if (t.to === 'savings') sv += t.c;
  });
  chk(ck === s.checking, 'checking ' + s.checking + ' != ledger ' + ck); chk(sv === s.savings, 'savings ' + s.savings + ' != ledger ' + sv);
  chk(s.checking >= 0 && s.savings >= 0, 'negative balance');
  s.bills.forEach(function(b){ var p = sum(s.ledger.filter(function(t){ return t.kind === 'bill' && t.ref === b.id; }), function(t){ return t.c; }); chk(p === b.paidAmt, 'bill ' + b.id + ' paid mismatch'); chk(owed(b) >= 0, 'bill ' + b.id + ' overpaid'); });
  ['pay1','pay2','other_ssi','other_ssdi','other_other','other_family','groc1','groc2','save1','save3','want2','want4','finish'].forEach(function(r){ var n = s.ledger.filter(function(t){ return t.ref === r && (t.from === 'world' || /^(save|finish)/.test(r)); }).length; chk(n <= 1, 'duplicate ' + r); });
  Object.keys(s.evRes).forEach(function(k){ chk(s.ledger.filter(function(t){ return t.ref === 'ev_' + k && t.from === 'world'; }).length <= 1, 'event income duplicated ' + k); });
  var inn = sum(s.ledger.filter(function(t){ return t.from === 'world'; }), function(t){ return t.c; }), out = sum(s.ledger.filter(function(t){ return t.to === 'world'; }), function(t){ return t.c; });
  chk(s.startChecking + s.startSavings + inn - out === s.checking + s.savings, 'money in/out does not add up');
  [1,2].forEach(function(n){ var d = s.done['pay' + n]; if (d){ var t = find(s.ledger, function(x){ return x.ref === 'pay' + n; }); chk(t && t.c === d.net, 'pay' + n + ' amount'); } });
  if (s.done.pay2) chk(s.done.pay2.hours === s.payHoursBase * 2 + s.schedVar - s.hoursLost + s.hoursExtra, 'pay2 hours');
  return e;
}

  if (gs.some(function(g){ return g.id === 'pantry'; })) good.push('You used a food pantry to get groceries.');
  if (r.saved) good.push('You saved ' + money(r.saved) + ' this month.');
  var unpaid = s.bills.filter(function(b){ return owed(b) > 0; }), late = s.bills.filter(function(b){ return b.lateApplied; });

  else if (!unpaid.length) good.push('You paid all your bills.');
  s.hourNotes.forEach(function(n){ var d = money(n.d || 0);
    if (n.k === 'sched') (n.h < 0 ? hard : good).push('Your manager posted ' + (n.h < 0 ? 'fewer' : 'more') + ' hours for you. Your paycheck was ' + d + (n.h < 0 ? ' smaller. This was not your fault.' : ' bigger.'));
    else if (n.k === 'extraShift') good.push('You worked an extra shift. Your paycheck was ' + d + ' bigger.');
    else if (n.k === 'callOff') hard.push('You missed ' + hoursWord(-n.h) + ' of work, so your paycheck was ' + d + ' smaller.');

    if (x.kind === 'want' && x.c) (r.fun > 4000 ? hard : good).push(k === 'bingo' ? 'You spent ' + money(x.c) + ' at bingo.' : d.title + ': you spent ' + money(x.c) + '.'); });

  s.notes.hard.forEach(function(n){ if (hard.indexOf(n) < 0) hard.push(n); });
  if (s.usedSavings) hard.push('You used ' + money(s.usedSavings) + ' from savings to cover costs.' + (s.paidBack ? ' You put ' + money(s.paidBack) + ' back.' : ''));
  if (s.low != null && s.low < 2000 && s.low < s.checking) hard.push('Your checking got down to ' + money(s.low) + ' at one point.');

  s.bills.filter(function(b){ return owed(b) > 0 && b.due > 4; }).forEach(function(b){ hard.push('You will pay ' + money(owed(b)) + ' for ' + b.label.toLowerCase() + ' next month.'); });
  if (s.owe) hard.push('You still owe ' + money(s.owe) + ' for the car repair.');
  if (late.length || unpaid.length) tips.push('On payday, pay your bills first.');

var modalReturn = null, modalKind = null;
function openModal(kind, html, wide){

}
function closeModal(){
  var m = $('modal'); if (m.classList.contains('hidden')) return;
  m.classList.add('hidden'); m.innerHTML = ''; modalKind = null; stopSpeech();
  if (modalReturn && document.body.contains(modalReturn)) modalReturn.focus(); else { var h = $('screen').querySelector('h1'); if (h) h.focus(); }
  modalReturn = null;
}
function trapFocus(e){
  var m = $('modal'); if (m.classList.contains('hidden')) return;
  var f = Array.prototype.filter.call(m.querySelectorAll('button,input,select,textarea,summary,[href],[tabindex]:not([tabindex="-1"])'), function(x){ return !x.disabled && x.offsetParent !== null; });
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (!m.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

  var h = '<h2 id="mTitle">⚙︎ Job coach settings</h2><div class="coach"><p class="small muted">For staff. Settings are saved only on this device. Nothing is sent anywhere.</p>';
  h += '<h3>Mode</h3><div role="radiogroup" aria-label="Game mode">' +
    '<label class="crow"><input type="radio" name="cMode" value="easy"' + (st.mode === 'easy' ? ' checked' : '') + '> <span><b>Easy</b>: simple paycheck (about 12% taxes), fewer choices, about 1 Life Happens event</span></label>' +
    '<label class="crow"><input type="radio" name="cMode" value="standard"' + (st.mode === 'standard' ? ' checked' : '') + '> <span><b>Standard</b>: tax details, more choices, about 2 Life Happens events</span></label></div>';
  h += '<h3>Life Happens and starting money</h3><div class="cgrid"><div class="cfield"><label for="cEvents">Life Happens events</label><select id="cEvents">' +
    [['none','None'],['fewer','Fewer (1)'],['normal','Normal (Easy 1, Standard 2)'],['more','More (Easy 2, Standard 3)']].map(function(o){ return '<option value="' + o[0] + '"' + (st.events === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    nf('cCheck', 'Starting checking ($)', st.startChecking, '0.01') + nf('cSave', 'Starting savings ($)', st.startSavings, '0.01') + '</div>';
  h += '<h3>Jobs: wages and hours</h3><p class="small muted">Weekly hours are rounded so every shift is the same length (in half hours). The job card shows the new times.</p><details><summary>💼 Wages and hours</summary>' + JOBS.map(function(j){ var o = find(st.jobs, function(x){ return x.id === j.id; });
    return '<div class="cgrid"><div class="cfield" style="grid-column:1/-1"><b>' + esc(j.title) + '</b> <span class="small muted">(' + daysStr(j.days) + ')</span></div>' + nf('jr_' + j.id, '$ an hour', o.rate, '0.01') + nf('jh_' + j.id, 'Hours a week', o.hours, '0.5') + '</div>'; }).join('') + '</details>';
  h += '<h3>Monthly costs ($)</h3>';
  COST_LABELS.forEach(function(g){ h += '<details><summary>' + g[0] + '</summary><div class="cgrid">' + g[1].map(function(c){ return nf('c_' + c[0], c[1], st.costs[c[0]], '0.01'); }).join('') + '</div></details>'; });
  h += '<h3>Public transportation</h3>';
  ['city','rural'].forEach(function(a){ var t = st.transit[a];
    h += '<details><summary>' + (a === 'city' ? '🏙️ City or town' : '🌾 Rural area') + '</summary>' + cb('t_' + a + '_bus', 'Public bus', t.bus) + cb('t_' + a + '_evenings', 'Buses run after 7:00 PM', t.evenings) + cb('t_' + a + '_weekends', 'Buses run on Saturday and Sunday', t.weekends) + cb('t_' + a + '_shared', 'Shared-ride van (book a day ahead)', t.shared) + '</details>'; });
  h += '<h3>Other income (starting amounts)</h3><div class="cgrid">' + OTHER.map(function(x){ return nf('o_' + x.k, x.label + ' ($ a month)', st.other[x.k], '0.01'); }).join('') + '</div><p class="small muted">The game does not calculate benefit changes.</p>';
  h += '<p class="small muted">Changes apply to the next month. A month already started keeps its numbers.</p><p id="coachMsg" class="small" aria-live="polite"></p></div>';
  h += '<div class="modal-actions">' + btn('Reset to defaults', 'coachReset') + btn('Cancel', 'closeModal') + btn('Save settings', 'coachSave', null, 'primary') + '</div>';
  return h;
}
A.openCoach = function(){ openModal('coach', coachHtml(settings), true); };
A.coachReset = function(){ openModal('coach', coachHtml(clone(DEFAULT_SETTINGS)), true); $('coachMsg').textContent = 'Defaults loaded. Press Save settings to keep them.'; };
A.coachSave = function(){
  var m = $('modal'), st = clone(settings);
  function v(id){ var el = $(id); return el ? Number(el.value) : NaN; }
  var mode = m.querySelector('input[name=cMode]:checked'); if (mode) st.mode = mode.value;
  st.events = $('cEvents').value; st.startChecking = v('cCheck'); st.startSavings = v('cSave');
  ['city','rural'].forEach(function(a){ ['bus','evenings','weekends','shared'].forEach(function(k){ st.transit[a][k] = !!$('t_' + a + '_' + k).checked; }); });
  Object.keys(st.costs).forEach(function(k){ st.costs[k] = v('c_' + k); });
  st.jobs.forEach(function(j){ j.rate = v('jr_' + j.id); j.hours = v('jh_' + j.id); });
  OTHER.forEach(function(x){ st.other[x.k] = v('o_' + x.k); });
  var oldOther = clone(settings.other);
  settings = mergeSettings(st); store(LS_SET, settings);
  if (state && !state.sim && JSON.stringify(state.other) === JSON.stringify(oldOther)) state.other = clone(settings.other);
  if (state && !state.sim && state.transport && state.jobId && !find(transportInfo(currentJob()).opts, function(o){ return o.id === state.transport; })) state.transport = null;
  closeModal(); rerender(); toast('✅ Settings saved on this device.');
};

/* ---------- Read aloud ---------- */
function speechOK(){ return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined'; }
var speaking = false;
function cleanSpeech(t){ return t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{2190}-\u{21FF}\u{2300}-\u{23FF}]/gu, ' ').replace(/\s+/g, ' ').trim(); }
function speechText(){
  var root = $('modal').classList.contains('hidden') ? $('screen') : $('modal'), parts = [];
  var h = root.querySelector('h1, h2'); if (h) parts.push(h.textContent);
  Array.prototype.forEach.call(root.querySelectorAll('.say, .choice .ct b, .job .jt'), function(el){ var t = el.textContent; if (t && parts.indexOf(t) < 0) parts.push(t); });
  return cleanSpeech(parts.join('. ').replace(/\.\s*\./g, '.'));
}
function setSpeakBtn(on){ var b = $('btnSpeak'); speaking = on; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.classList.toggle('on', on); b.setAttribute('aria-label', on ? 'Stop reading' : 'Read this screen out loud'); b.innerHTML = on ? '⏹ <span>Stop</span>' : '🔊 <span>Read aloud</span>'; }
function stopSpeech(){ if (speechOK()){ try{ window.speechSynthesis.cancel(); }catch(e){} } if (speaking) setSpeakBtn(false); }
A.speak = function(){
  if (!speechOK()) return;
  if (speaking){ stopSpeech(); return; }
  var t = speechText(); if (!t) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.92;
  u.onend = u.onerror = function(){ setSpeakBtn(false); };
  setSpeakBtn(true);
  window.speechSynthesis.speak(u);
};

/* ---------- Clicks, typing, keys ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (el){
    if (el.disabled) return;
    var f = A[el.getAttribute('data-act')]; if (!f) return;
    e.preventDefault(); f(el.getAttribute('data-arg'), el); return;
  }
  if (e.target === $('modal')) closeModal();
});
document.addEventListener('input', function(e){ var k = e.target.getAttribute && e.target.getAttribute('data-in'); if (k && IN[k]) IN[k](e.target.value, e.target); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (!$('modal').classList.contains('hidden')){ e.preventDefault(); closeModal(); } else if (speaking) stopSpeech(); }
  else if (e.key === 'Tab') trapFocus(e);
  else if (e.key === 'Enter' && e.target && e.target.id === 'nameIn'){ e.preventDefault(); A.goAvatar(); }
});
window.addEventListener('pagehide', stopSpeech);

/* ---------- Test hooks (read-only helpers; no network) ---------- */
window.MMM = {
  get state(){ return state; }, get settings(){ return settings; },
  check: function(){ return invariants(); }, go: function(sc){ go(sc); }, plan: function(){ return plan(); }, jobs: function(){ return allJobs(); },
  transport: function(){ return state.jobId ? transportInfo(currentJob()) : null; }, report: function(){ return state.sim ? reportData() : null; },
  payFor: function(n){ return payFor(n); }, paycheckFor: function(rate, h){ return paycheckFor({rate:rate}, h); },
  events: function(){ return Object.keys(EV()); }, step: function(){ return state.sim ? curStep() : null; }, avatars: AVATARS.map(function(a){ return a.id; }),
  speechText: function(){ return speechText(); },
  sampleEvents: function(n){ var seen = {}, old = rng; rng = mulberry32(99); for (var i = 0; i < (n || 200); i++) genEvents().forEach(function(e){ seen[e.k] = (seen[e.k] || 0) + 1; }); rng = old; return seen; }
};

/* ---------- Start ---------- */
if (state.screen !== 'welcome' && state.name) bootResume = true;
render(true);
})();
</script>
