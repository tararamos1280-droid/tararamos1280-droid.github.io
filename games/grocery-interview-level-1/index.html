<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grocery Job Interview Challenge</title><style>:root{font-family:Arial,sans-serif;color:#183127;background:#f0f7f1}body{margin:0;padding:20px}.game{max-width:680px;margin:15px auto;background:white;border-radius:18px;padding:25px;box-shadow:0 6px 24px #18312720}h1{margin:0 0 8px;font-size:1.8rem}.sub{color:#536b5b}.meta{display:flex;justify-content:space-between;margin:22px 0 8px;font-weight:bold}.bar{height:9px;background:#e0e9e2;border-radius:10px;overflow:hidden}.fill{height:100%;background:#168347;transition:width .2s}h2{font-size:1.35rem;margin-top:25px}button{font:inherit;cursor:pointer}.answer{display:block;width:100%;text-align:left;background:white;border:2px solid #ccd9d0;border-radius:12px;padding:16px;margin:12px 0;line-height:1.4}.answer:hover:not(:disabled),.answer:focus-visible{border-color:#168347;background:#f0faf3}.answer:disabled{cursor:default;color:#183127}.answer.correct{border-color:#168347;background:#e7f7eb}.answer.wrong{border-color:#c2413a;background:#fff0ee}.feedback{background:#eef5ef;border-radius:12px;padding:17px;margin:20px 0;line-height:1.5}.next{border:0;border-radius:12px;background:#13743d;color:white;padding:14px 22px;font-weight:bold;width:100%}.next:hover{background:#0d572c}.result{text-align:center;padding:25px 0}.result strong{font-size:3rem;color:#13743d}footer{margin-top:22px;color:#607468;font-size:.85rem;text-align:center}@media(max-width:480px){body{padding:8px}.game{padding:18px}}h2:focus{outline:none}.next.hublink{display:block;box-sizing:border-box;margin-top:12px;background:white;color:#13743d;border:2px solid #13743d;text-decoration:none;text-align:center}.next.hublink:hover{background:#f0faf3}.readbtn{border:2px solid #13743d;border-radius:16px;background:white;color:#183127;padding:12px 18px;min-height:48px;font-weight:bold}a:focus-visible,button:focus-visible{outline:3px solid #e69500;outline-offset:3px}</style></head><body><nav style="max-width:900px;margin:16px auto;padding:0 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><a href='/' style='color:inherit;font:700 16px system-ui'>← Back to game hub</a><button id="read" type="button" class="readbtn">🔊 Read aloud</button></nav><p id="speechStatus" role="status" style="max-width:680px;margin:0 auto;font-size:16px"></p><main class="game"><div style="font-size:2.3rem" aria-hidden="true">🛒</div><h1>Grocery Job Interview Challenge!</h1><div class="sub">5 fun interview questions for a grocery or stocking position.</div><div id="app" aria-live="polite"></div><footer>Practice activity — not official employer interview questions.</footer></main><script>
const qs=[
{q:'Tell me a little about yourself.',a:["I'm dependable, I like staying busy, and I'm excited to learn new skills.","I'm actually a secret superhero, but I only work on Tuesdays.","I mostly enjoy sleeping and eating pizza all day."],c:0,good:"Great answer! You told the interviewer about your strengths and showed that you're ready to work.",bad:"That might get a laugh, but an interviewer wants to learn about your work skills. Try talking about being dependable, helpful, or willing to learn."},
{q:'Why do you want to work at the grocery store?',a:["Because I heard employees get to ride the shopping carts down the aisles!","I want to help customers, stock groceries, and be part of a team.","I'm hoping they'll let me take all the snacks home."],c:1,good:"Excellent! You explained why you're interested in the grocery store and showed you understand the job.",bad:"Funny answer! But employers want to know you're interested in the actual job. Talk about stocking shelves, helping customers, or working with a team."},
{q:"What would you do if you didn't know where a grocery item belonged?",a:["Put everything in the freezer. Problem solved!","Build a giant tower of groceries and call it art.","Ask my supervisor or a coworker where the item belongs."],c:2,good:"Exactly! Asking questions is a smart workplace skill. It helps you do the job correctly.",bad:"That would make grocery shopping interesting! But products need to go in the correct places. Asking for help is the best choice."},
{q:'What would you do if a customer asked where the cereal aisle was?',a:["Politely show them where it is or ask another employee to help.","Tell them the cereal is hiding and they have to find it.","Challenge them to a race around the store."],c:0,good:"Perfect! Helping customers politely shows good customer service.",bad:"That would be a memorable shopping trip! But customers need helpful, respectful answers. Offer assistance or find someone who can help."},
{q:'What would you do if you finished stocking all your shelves?',a:["Build a fort out of empty boxes and declare myself king of the grocery store.","Check my task list for the next job. If the list is done, ask my supervisor.","Take a three-hour nap in the cereal aisle."],c:1,good:"Great job! Checking your task list first shows you can work on your own. When the list is done, asking your supervisor is the next step.",bad:"That sounds like an adventure, but when you finish, check your task list for the next job. If the list is done, ask your supervisor."}
];let idx=0,pick=null,score=0;const app=document.getElementById('app');function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function focusQ(){const h=document.getElementById('qh')||app.querySelector('h2');if(h){h.tabIndex=-1;h.focus()}}function render(){stopVoice();ttsStatus('');app.replaceChildren();if(idx===qs.length){const r=el('section','result');r.append(el('div','', '🏆'),el('h2','',score===50?'Interview Superstar!':score>=30?'Great Practice!':'Keep Practicing!'),el('strong','',score+' / 50'),el('p','',`You answered ${score/10} out of 5 questions correctly.`),el('p','',"Remember: Be polite, be dependable, ask questions, and show you're ready to learn!"));const b=el('button','next','🔄 Play Again');b.onclick=()=>{idx=0;pick=null;score=0;render();focusQ()};const hub=el('a','next hublink','← Back to game hub');hub.href='/';r.append(b,hub);app.append(r);return}const meta=el('div','meta');meta.append(el('span','',`Question ${idx+1} of 5`),el('span','',`${score} points`));const bar=el('div','bar');const fill=el('div','fill');fill.style.width=((idx+1)/5*100)+'%';bar.append(fill);const qh=el('h2','',qs[idx].q);qh.id='qh';qh.tabIndex=-1;app.append(meta,bar,qh);qs[idx].a.forEach((a,i)=>{const b=el('button','answer',String.fromCharCode(65+i)+'. '+a);b.disabled=pick!==null;if(pick!==null&&i===qs[idx].c)b.classList.add('correct');else if(pick===i)b.classList.add('wrong');b.onclick=()=>{pick=i;if(i===qs[idx].c)score+=10;render()};app.append(b)});if(pick!==null){const good=pick===qs[idx].c;const f=el('div','feedback');f.append(el('strong','',good?'🎉 Awesome! +10 points':'😄 Oops! That one is a little silly!'),el('p','',good?qs[idx].good:qs[idx].bad));if(!good)f.append(el('p','',`Best answer: ${qs[idx].a[qs[idx].c]}`));app.append(f);const n=el('button','next',idx===4?'See Final Score →':'Next Question →');n.onclick=()=>{idx++;pick=null;render();window.scrollTo(0,0);focusQ()};app.append(n)}}render();
/* Read aloud (offline, browser speech). Handles missing voices, waits for voiceschanged, cancels before speaking, and reports failures. */
var ttsVoices=[];function ttsOk(){return 'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window}
function ttsLoad(){try{ttsVoices=window.speechSynthesis.getVoices()||[]}catch(e){ttsVoices=[]}}
if(ttsOk()){ttsLoad();try{window.speechSynthesis.addEventListener('voiceschanged',ttsLoad)}catch(e){window.speechSynthesis.onvoiceschanged=ttsLoad}}
function ttsVoice(){return ttsVoices.find(function(v){return /^en[-_]US/i.test(v.lang)&&v.localService})||ttsVoices.find(function(v){return /^en[-_]US/i.test(v.lang)})||ttsVoices.find(function(v){return /^en/i.test(v.lang)})||null}
function ttsStatus(msg){var s=document.getElementById('speechStatus');if(s)s.textContent=msg||''}
function stopVoice(){if(ttsOk()){try{window.speechSynthesis.cancel()}catch(e){}}}
function speak(words){ttsStatus('');if(!ttsOk()){ttsStatus('Read aloud is not available on this device. Ask a helper to read.');return}
 stopVoice();if(!ttsVoices.length)ttsLoad();
 var go=function(){var u=new SpeechSynthesisUtterance(words),v=ttsVoice(),started=false;if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=.85;
  u.onstart=function(){started=true;ttsStatus('')};
  u.onerror=function(e){if(e&&(e.error==='canceled'||e.error==='interrupted'))return;ttsStatus('Read aloud could not play on this device. Ask a helper to read.')};
  try{if(window.speechSynthesis.paused)window.speechSynthesis.resume();window.speechSynthesis.speak(u)}catch(e){ttsStatus('Read aloud could not play on this device. Ask a helper to read.');return}
  setTimeout(function(){if(!started&&!window.speechSynthesis.speaking&&!window.speechSynthesis.pending)ttsStatus('Read aloud did not start. Check the volume, or ask a helper to read.')},2500)};
 /* short delay after cancel() avoids a Chrome bug where the next utterance is dropped; wait briefly for voices if none loaded yet */
 if(ttsVoices.length)setTimeout(go,60);else{var waited=0,t=setInterval(function(){ttsLoad();waited+=100;if(ttsVoices.length||waited>=1000){clearInterval(t);go()}},100)}}
window.addEventListener('pagehide',stopVoice);
document.getElementById('read').onclick=()=>{let w;if(idx===qs.length){w=app.querySelector('.result').innerText.replace('🔄','').replace('← Back to game hub','')}else{const q=qs[idx];w='Question '+(idx+1)+' of 5. '+q.q+' '+q.a.map((a,i)=>'Choice '+'ABC'[i]+'. '+a+'.').join(' ');const f=app.querySelector('.feedback');if(f)w+=' '+f.innerText}speak(w)};
</script></body></html>
