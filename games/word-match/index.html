<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Word Match</title>
<style>
:root{--bg:#eef2f5;--ink:#141c28;--muted:#46505e;--line:#cfd7e2;--pri:#0f766e;--pri-d:#0a5550;--good:#146c35;--good-l:#e3f4e8;--bad:#a3221a;--back:#2f4858;--hh:76px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:20px/1.3 -apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overscroll-behavior:none}
button,[role=button]{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.hidden{display:none!important}
.wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:22px;margin:0 0 0 6px;color:var(--pri-d);white-space:nowrap}
#count{flex:1;text-align:center;font-size:21px;font-weight:800;white-space:nowrap}
.sp{flex:1}
.tb{flex:none;height:64px;min-width:64px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb svg{width:26px;height:26px}.tb.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{flex:1;min-height:0;padding:12px;overflow:auto;position:relative}
/* setup */
.setup{max-width:960px;margin:0 auto;display:grid;gap:12px}
.sec h2{font-size:18px;margin:0 0 6px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.r5{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}@media (min-width:900px) and (min-height:561px){.r5{grid-template-columns:repeat(5,1fr)}}
.ch{min-height:64px;padding:6px 8px;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:20px;font-weight:700;line-height:1.15}
.ch small{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:2px}
.ch.sel{border-color:var(--pri);background:#e3f3f1}
.go{min-height:68px;width:100%;border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:26px;font-weight:800}
.go.alt{background:#fff;color:var(--pri-d);border:3px solid var(--pri)}
@media (max-height:760px){.ch small{display:none}}
/* */.col{display:contents}
@media (orientation:landscape) and (max-height:560px){:root{--hh:68px}.setup{grid-template-columns:1fr 1fr;align-items:start}.col{display:grid;gap:6px}.setup{gap:6px 12px}main{padding:6px 12px}.sec h2{font-size:14px;margin-bottom:2px}.go{min-height:64px}}
/* pick mode */
.pick{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1000px;margin:0 auto}
.wordcard{flex:0 0 30%;min-height:0;border-radius:20px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:clamp(44px,min(18vw,11vh),120px);letter-spacing:1px}
.wordcard.ok{border-color:var(--good);background:var(--good-l)}
.choices{flex:1;min-height:0;display:grid;gap:12px}
.n2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.n3{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
@media (min-aspect-ratio:3/4){.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.n3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}}
@media (orientation:landscape){.pick{flex-direction:row}.wordcard{flex:0 0 36%;font-size:clamp(40px,min(8vw,20vh),120px)}.n4{grid-template-columns:1fr 1fr}}
.choice{min-height:64px;min-width:64px;border-radius:18px;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;box-shadow:0 3px 0 var(--line)}
.choice svg{width:100%;height:100%;max-width:240px;max-height:240px;pointer-events:none}
.choice.ok{border-color:var(--good);background:var(--good-l);box-shadow:0 3px 0 var(--good)}
.choice.no{border-color:var(--bad);animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:8px 22px;border-radius:30px;font-size:24px;font-weight:800;pointer-events:none;z-index:3;white-space:nowrap}
.toast.ok{background:var(--good);color:#fff}.toast.no{background:#fff;color:var(--bad);border:2px solid var(--bad)}
/* memory */
.grid{display:grid;gap:10px;height:100%;width:100%}
.card{min-width:0;min-height:0;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid transparent}
.card .bk,.card .fr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card .bk{background:var(--back);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.card .fr{background:#fff;padding:8%;visibility:hidden}
.card.up .fr,.card.done .fr{visibility:visible}.card.up .bk,.card.done .bk{visibility:hidden}
.card.up,.card.done{border-color:var(--line);animation:flip .25s}
.card.done{border-color:var(--good)}.card.done .fr{background:var(--good-l)}
@keyframes flip{from{transform:scaleX(.2)}to{transform:none}}
.fr svg{width:100%;height:100%;max-width:200px;max-height:200px}
.fr .w{font-size:var(--wf,48px);font-weight:700;color:#000}
/* end */
.end{max-width:900px;margin:0 auto;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%;gap:8px}
.end h2{font-size:clamp(26px,min(7vw,7vh),40px);margin:0}
.end p{margin:0;font-size:20px}
.words{font-size:clamp(30px,min(9vw,7vh),56px);font-weight:700;display:flex;flex-wrap:wrap;justify-content:center;gap:0 28px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px;background:#fff}.sheet div{border:2px solid var(--line);border-radius:12px;text-align:center;font-size:24px;font-weight:700;padding:8px}.sheet svg{width:120px;height:120px;display:block;margin:0 auto}
</style></head><body>
<div class="wrap">
<header><h1 id="ttl">Word Match</h1><button class="tb hidden" id="newset" aria-label="Back to setup">Sets</button><span id="count" aria-live="polite"></span><button class="tb" id="snd" aria-pressed="false"></button></header>
<main id="app"></main>
</div>

"in":svg('<rect x="56" y="10" width="38" height="84" fill="#3f4a5a" '+K+'/><rect x="60" y="14" width="30" height="80" fill="#1c2533"/><path d="M4 92 H96" stroke="#1c2533" stroke-width="3"/><path d="M8 52 H58" stroke="#15803d" stroke-width="10" stroke-linecap="round"/><path d="M50 36 L70 52 L50 68Z" fill="#15803d" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>'),

push:svg('<rect x="18" y="4" width="64" height="92" fill="#cfd7e2" '+K+'/><rect x="24" y="10" width="52" height="86" fill="#e8eef4" stroke="#9aa5b4" stroke-width="2"/><rect x="28" y="38" width="44" height="22" rx="3" fill="#9aa5b4" stroke="#1c2533" stroke-width="2"/><text x="50" y="55" '+TX+' font-size="15" fill="#1c2533">PUSH</text>'),
pull:svg('<rect x="18" y="4" width="64" height="92" fill="#cfd7e2" '+K+'/><rect x="24" y="10" width="52" height="86" fill="#e8eef4" stroke="#9aa5b4" stroke-width="2"/><path d="M62 34 h6 v36 h-6" fill="none" stroke="#1c2533" stroke-width="5" stroke-linejoin="round"/><text x="42" y="58" '+TX+' font-size="15" fill="#1c2533">PULL</text>')};
for(var nk in NEWPIC)PIC[nk]=NEWPIC[nk];

var NEWAUDIO={};["cat","bag","hat","dog","sun","cup","bed","pig","bus","box","map","pen","exit","door","stop","in","out","open","push","pull","that","there"].forEach(function(w){NEWAUDIO[w]=1});
function hasPic(w){return !!PIC[w]}
var SIZES={easy:{name:"Easy",n:4},medium:{name:"Medium",n:6},hard:{name:"Hard",n:8}};
var ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var $=function(id){return document.getElementById(id)};
var app=$("app"),cnt=$("count"),sndB=$("snd"),newB=$("newset"),ttl=$("ttl");
var cfg={mode:"pick",set:"easy",size:"medium",choices:3,wordsOnly:false},sound=false,G=null,gen=0;
try{var c=JSON.parse(localStorage.getItem("wordMatch.v2"));if(c){for(var k in cfg)if(c[k]!==undefined)cfg[k]=c[k];if(cfg.mode!=="memory")cfg.mode="pick";if([2,3,4].indexOf(cfg.choices)<0)cfg.choices=3}}catch(e){}
function saveCfg(){try{localStorage.setItem("wordMatch.v2",JSON.stringify(cfg))}catch(e){}}
var player=document.createElement("audio");player.preload="auto";player.setAttribute("playsinline","");document.body.appendChild(player);
function say(w){if(!sound)return;try{player.src=(NEWAUDIO[w]?"audio/":"../jeremy-reading/audio/words/")+w+".mp3";var p=player.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function drawSnd(){sndB.innerHTML=(sound?ON:OFF)+'<span>'+(sound?"On":"Off")+'</span>';sndB.classList.toggle("on",sound);sndB.setAttribute("aria-pressed",String(sound));sndB.setAttribute("aria-label",sound?"Sound on":"Sound off")}
sndB.addEventListener("click",function(){sound=!sound;drawSnd()});drawSnd();
newB.addEventListener("click",setup);
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function setWords(){var p=SETS[cfg.set].words;if(p)return p.slice();var a=shuf(SETS.fishing.words),b=shuf(SETS.fixit.words),o=[];for(var i=0;i<8;i++)o.push(i%2?b[i>>1]:a[i>>1]);return o}
function playing(on){newB.classList.toggle("hidden",!on);ttl.classList.toggle("hidden",on);if(!on)cnt.textContent=""}
var toastT;function toast(t,cls){var e=$("toast");if(!e){e=document.createElement("div");e.id="toast";app.appendChild(e)}e.className="toast "+cls;e.textContent=t;clearTimeout(toastT);toastT=setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},1100)}

// ---- memory layout: pick columns that give the biggest cards; never rebuild DOM on resize
function layout(n){var W=app.clientWidth-24,H=app.clientHeight-24,gap=10,best=null;
 for(var cols=2;cols<=8;cols++){var rows=Math.ceil(n/cols);if(cols*rows-n>=cols)continue;var cw=(W-gap*(cols-1))/cols,ch=(H-gap*(rows-1))/rows;var sc=Math.min(cw,ch*0.85);if(!best||sc>best.sc)best={cols:cols,rows:rows,cw:cw,ch:ch,sc:sc}}return best}
function hardPairs(){var L=layout(16),f=Math.min(L.ch*0.4,(L.cw-20)/(0.62*6));return f>=26?8:6}
function fitGrid(){var g=$("grid");if(!g||!G)return;var L=layout(G.cards.length),ml=Math.max.apply(null,G.words.map(function(w){return w.length}));
 g.style.gridTemplateColumns="repeat("+L.cols+",1fr)";g.style.gridTemplateRows="repeat("+L.rows+",1fr)";
 g.style.setProperty("--wf",Math.floor(Math.max(18,Math.min(L.ch*0.42,(L.cw-20)/(0.62*ml),84)))+"px")}
window.addEventListener("resize",fitGrid);

function setup(){gen++;G=null;playing(false);
 function btn(key,val,label,sub){var sel=String(cfg[key])===String(val);return'<button class="ch'+(sel?' sel':'')+'" data-k="'+key+'" data-v="'+val+'" aria-pressed="'+sel+'">'+label+(sub?'<small>'+sub+'</small>':'')+'</button>'}
 var mode='<div class="sec"><h2>Game</h2><div class="row">'+btn("mode","pick","Pick the Picture","word, then pick its picture")+btn("mode","memory","Memory flip","turn over cards to find pairs")+'</div></div>';
 var set='<div class="sec"><h2>Words</h2><div class="row r5">'+btn("set","easy","Easy Words","cat, dog, sun…")+btn("set","signs","Sign Words","exit, stop, push…")+btn("set","fishing","Fishing","fish, net, rod…")+btn("set","fixit","Fix-It","nut, bolt, saw…")+btn("set","mixed","Mixed","some of each")+'</div></div>';
 var opt;
 if(cfg.mode==="pick")opt='<div class="sec"><h2>Pictures to choose from</h2><div class="row">'+btn("choices",2,"2")+btn("choices",3,"3")+btn("choices",4,"4")+'</div></div>';
 else{var hp=0;opt='<div class="sec"><h2>Size</h2><div class="row">'+btn("size","easy","Easy","4 pairs")+btn("size","medium","Medium","6 pairs")+btn("size","hard","Hard","8 pairs")+'</div></div><div class="sec"><h2>Cards</h2><div class="row">'+btn("wordsOnly",false,"Word + picture")+btn("wordsOnly",true,"Words only")+'</div></div>'}
 app.innerHTML='<div class="setup"><div class="col">'+mode+set+'</div><div class="col">'+opt+'<button class="go" id="go">Start</button></div></div>';
 app.querySelectorAll(".ch").forEach(function(b){b.addEventListener("click",function(){var k=b.dataset.k,v=b.dataset.v;cfg[k]=k==="wordsOnly"?v==="true":k==="choices"?+v:v;saveCfg();setup()})});
 $("go").addEventListener("click",function(){cfg.mode==="pick"?startPick():startMem()})}

// ---- Pick the Picture
function startPick(){gen++;var pool=setWords().filter(hasPic);G={mode:"pick",pool:pool,order:shuf(pool),i:0,words:[],lock:false,n:pool.length};playing(true);nextPick()}
function nextPick(){if(G.i>=G.order.length)return end();var w=G.order[G.i],n=Math.min(cfg.choices,G.pool.length);
 var opts=shuf([w].concat(shuf(G.pool.filter(function(x){return x!==w})).slice(0,n-1)));G.cur=w;G.lock=false;
 cnt.textContent=G.i+" of "+G.n+" matched";
 app.innerHTML='<div class="pick"><div class="wordcard" id="wc" role="button" tabindex="0" aria-label="Word: '+w+'. Tap to hear it.">'+w+'</div><div class="choices n'+n+'">'+opts.map(function(x){return'<button class="choice" data-v="'+x+'" aria-label="Picture: '+x+'">'+PIC[x]+'</button>'}).join("")+'</div></div>';
 $("wc").addEventListener("click",function(){say(w)});
 var my=gen;
 app.querySelectorAll(".choice").forEach(function(b){b.addEventListener("click",function(){if(G.lock||my!==gen)return;
  if(b.dataset.v===w){G.lock=true;b.classList.add("ok");$("wc").classList.add("ok");G.words.push(w);G.i++;cnt.textContent=G.i+" of "+G.n+" matched";toast("Match!","ok");say(w);
   setTimeout(function(){if(my===gen)nextPick()},1000)}
  else{b.classList.remove("no");void b.offsetWidth;b.classList.add("no");toast("Try again","no")}})})}

// ---- Memory flip
function startMem(){gen++;var n=SIZES[cfg.size].n;if(cfg.size==="hard")n=hardPairs();
 var src=setWords();if(!cfg.wordsOnly)src=src.filter(hasPic);n=Math.min(n,src.length);var words=shuf(src).slice(0,n),cards=[];words.forEach(function(w){cards.push({w:w,k:"word"});cards.push({w:w,k:cfg.wordsOnly?"word":"pic"})});
 G={mode:"mem",words:words,cards:shuf(cards),open:[],lock:false,found:0,n:n};playing(true);
 app.innerHTML='<div class="grid" id="grid">'+G.cards.map(function(c,i){return'<div class="card" role="button" tabindex="0" data-i="'+i+'" aria-label="Card '+(i+1)+', face down"><div class="bk"></div><div class="fr">'+(c.k==="pic"?PIC[c.w]:'<span class="w">'+c.w+'</span>')+'</div></div>'}).join("")+'</div>';
 fitGrid();var my=gen;
 app.querySelectorAll(".card").forEach(function(b){b.addEventListener("click",function(){if(my===gen)flip(+b.dataset.i,b)})});upd()}
function upd(){cnt.textContent=G.found+" of "+G.n+" matched"}
function el(i){return app.querySelector('[data-i="'+i+'"]')}
function flip(i,b){var c=G.cards[i];if(G.lock||c.done||c.up)return;
 c.up=true;b.classList.add("up");b.setAttribute("aria-label",(c.k==="pic"?"Picture: ":"Word: ")+c.w);if(c.k==="word")say(c.w);
 G.open.push(i);if(G.open.length<2)return;
 var ia=G.open[0],iz=G.open[1],a=G.cards[ia],z=G.cards[iz];G.open=[];
 if(a.w===z.w){a.done=z.done=true;a.up=z.up=false;el(ia).classList.add("done");el(iz).classList.add("done");G.found++;toast("Match!","ok");say(a.w);upd();
  if(G.found===G.n){G.lock=true;var my=gen;setTimeout(function(){if(my===gen)end()},1100)}}
 else{G.lock=true;var my2=gen;setTimeout(function(){if(my2!==gen)return;[ia,iz].forEach(function(k){G.cards[k].up=false;var e=el(k);if(e){e.classList.remove("up");e.setAttribute("aria-label","Card "+(k+1)+", face down")}});G.lock=false},1500)}}

function end(){gen++;var words=G.mode==="pick"?G.words:G.words;newB.classList.add("hidden");
 app.innerHTML='<div class="end"><h2>All matched, nice work Jeremy!</h2><p>Write these in your book:</p><div class="words">'+words.map(function(w){return'<span>'+w+'</span>'}).join("")+'</div><div class="btns"><button class="go" id="again">Play again</button><button class="go alt" id="ns">New set</button></div></div>';
 $("again").addEventListener("click",function(){cfg.mode==="pick"?startPick():startMem()});$("ns").addEventListener("click",setup)}
window.__wm={pics:PIC,sets:SETS,state:function(){return G},cfg:cfg};
if(/[?&]pics=1/.test(location.search)){document.querySelector('.wrap').style.height='auto';app.style.overflow='visible';app.innerHTML='<div class="sheet">'+SETS.easy.words.concat(SETS.signs.words.filter(hasPic),SETS.fishing.words,SETS.fixit.words).map(function(w){return'<div>'+PIC[w]+w+'</div>'}).join("")+'</div>'}else setup();
})();
</script></body></html>
