<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Match - Flip Cards</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,Arial,sans-serif;background:#fff8ee;color:#222;display:flex;flex-direction:column;align-items:center}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #222;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{width:100%;max-width:1000px;height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 10px;gap:10px}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon{min-width:56px;min-height:56px;border-radius:16px;border:3px solid #333;background:#fff;font-size:28px;line-height:1}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #555;background:#fff}
.dot.done{background:#2e9b3e;border-color:#2e9b3e}
h1{margin:0;font-size:1px}
/* flip stand */
.stand{display:flex;flex-direction:column;align-items:center;width:100%}
.cards{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.card{background:#fff;border:3px solid #444;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 0 #0002;position:relative}
.card::before{content:"";position:absolute;top:4px;left:20%;right:20%;height:6px;background:repeating-linear-gradient(90deg,#888 0 4px,transparent 4px 10px)}
.pic{width:var(--c);height:var(--c)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.let{width:calc(var(--c)*.72);height:var(--c);font-size:calc(var(--c)*.62);font-weight:800;font-family:"Comic Sans MS","Century Gothic",Arial,sans-serif}
.cons{color:#1a2f7a}.vow{color:#d01818}
.base{height:22px;background:#f08a1c;border-radius:6px;margin-top:-2px;width:100%;max-width:calc(var(--c)*3.5);box-shadow:0 4px 0 #b55f05}
.stand{--c:min(28vw,26vh,220px)}
.speak{min-width:72px;min-height:72px;font-size:38px;border-radius:50%;background:#ffd84d;border:3px solid #333}
.choices{display:flex;gap:10px;justify-content:center;width:100%}
.ch{flex:0 0 auto;width:min(31vw,34vh,300px);aspect-ratio:1;padding:0;border:4px solid #444;border-radius:16px;background:#fff;overflow:hidden;position:relative}
.ch img{width:100%;height:100%;object-fit:cover;display:block}
.ch.no{opacity:.35}
.ch.yes{border-color:#2e9b3e;border-width:7px}
.fb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:min(50vw,50vh);font-weight:900}
.fb.on{display:flex}
.fb.good{color:#2e9b3e}.fb.bad{color:#d01818}
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.play{width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;background:#2e9b3e;color:#fff;border:6px solid #1c6a28;font-size:min(30vw,120px)}
.coach{font-size:16px}
.coach summary{min-height:48px;padding:12px;cursor:pointer}
.coach label{display:block;margin:6px 0;font-size:18px}
.coach select{font-size:18px;min-height:44px}
.pickh{margin:0;font-size:min(14vw,64px);font-weight:900;color:#1a2f7a;font-family:"Comic Sans MS","Century Gothic",Arial,sans-serif;display:flex;align-items:center;gap:12px}
.pickh span{font-size:1.1em;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(10px)}}
.ch.pk{border:8px solid #f08a1c;border-radius:24px;box-shadow:0 8px 0 #b55f05,0 10px 18px #0004;transition:transform .08s,box-shadow .08s;cursor:pointer}
.ch.pk:nth-child(2){border-color:#2e7bd6;box-shadow:0 8px 0 #1a4f8f,0 10px 18px #0004}
.ch.pk:nth-child(3){border-color:#2e9b3e;box-shadow:0 8px 0 #1c6a28,0 10px 18px #0004}
.ch.pk:active{transform:translateY(6px);box-shadow:0 2px 0 #0006}
.ch.pk:focus-visible{outline:5px solid #ffd84d;outline-offset:3px}
.big{font-size:min(30vw,140px)}
</style>
</head>
<body>
<main id="app"></main>
<div id="live" class="sr" aria-live="polite"></div>
<div id="fb" class="fb" aria-hidden="true"></div>
<script>
var KEY="wordMatch.v4"; /* choices: URL > coach-saved > 3 */
var SETS=[["bag","cat","sun","dog"],["hat","cup","pig","bed"],["bus","map","pen","box"]];
var ALL=[].concat.apply([],SETS);
var VOW="aeiou",SOUNDS="abcdeghimnopstu";
var Q=new URLSearchParams(location.search);
var cfg={set:0,choices:3};
var qs=parseInt(Q.get("set"),10);if(qs>=1&&qs<=3)cfg.set=qs-1;
try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv&&(sv.choices==2||sv.choices==3))cfg.choices=sv.choices}catch(e){}
var qc=parseInt(Q.get("choices"),10);if(qc==2||qc==3)cfg.choices=qc;
var URLSET=qs>=1&&qs<=3;
var COACH=Q.get("coach")==="1";
var app=document.getElementById("app"),live=document.getElementById("live"),fbEl=document.getElementById("fb");
var aud=new Audio();
function play(src){try{aud.pause();aud.src=src;aud.currentTime=0;var p=aud.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function sayWord(w){play("audio/"+w+".mp3")}
var ac;function tone(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var t=ac.currentTime;(ok?[660,880]:[220,180]).forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=ok?"sine":"square";g.gain.setValueAtTime(.15,t+i*.15);g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.3);o.connect(g);g.connect(ac.destination);o.start(t+i*.15);o.stop(t+i*.15+.3)})}catch(e){}}
function say(m){live.textContent="";setTimeout(function(){live.textContent=m},50)}
function el(t,a,k){var e=document.createElement(t);for(var x in a){if(x=="text")e.textContent=a[x];else if(x=="cls")e.className=a[x];else e.setAttribute(x,a[x])}(k||[]).forEach(function(c){e.appendChild(c)});return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var st;
function startScreen(){
  app.innerHTML="";
  var h=el("h1",{tabindex:"-1",cls:"sr",text:"Word Match. Press play."});
  var p=el("button",{cls:"play","aria-label":"Play",text:"▶"});
  p.addEventListener("click",function(){URLSET?begin():picker()});
  var kids=[h,p];
  if(COACH){
    var cs=el("select",{id:"chSel"});[2,3].forEach(function(n){var o=el("option",{value:n,text:n+" pictures"});if(n==cfg.choices)o.selected=true;cs.appendChild(o)});
    cs.addEventListener("change",function(){cfg.choices=+cs.value;try{localStorage.setItem(KEY,JSON.stringify({choices:cfg.choices}))}catch(e){};say("Saved")});
    var out=el("p",{id:"linkOut",style:"word-break:break-all;font-size:16px"});
    var cp=el("button",{cls:"icon",style:"padding:0 14px;font-size:18px",text:"Copy link for Jeremy","aria-label":"Copy link for Jeremy"});
    cp.addEventListener("click",function(){var u=location.origin+location.pathname;out.textContent=u;var ok=function(){say("Link copied")};try{navigator.clipboard.writeText(u).then(ok,function(){})}catch(e){}});
    kids.push(el("details",{cls:"coach",open:""},[el("summary",{text:"Coach settings"}),el("label",{for:"chSel",text:"Choices "}),cs,el("p",{},[cp]),out]));
  }
  app.appendChild(el("div",{cls:"start"},kids));
  h.focus();
}
function picker(){
  app.innerHTML="";
  var h=el("h1",{tabindex:"-1",cls:"pickh","aria-label":"Pick one"},[el("span",{"aria-hidden":"true",text:"👇"}),el("b",{text:"Pick one"})]);
  var row=el("div",{cls:"choices"});
  SETS.forEach(function(ws,i){var b=el("button",{cls:"ch pk","aria-label":"Pick one: "+ws.join(", ")},[el("img",{src:"img/"+ws[0]+".jpg",alt:""})]);b.addEventListener("click",function(){cfg.set=i;begin()});row.appendChild(b)});
  var home=el("button",{cls:"icon","aria-label":"Home",text:"⌂"});home.addEventListener("click",startScreen);
  app.appendChild(el("div",{cls:"top"},[home]));app.appendChild(h);
  app.appendChild(el("div",{cls:"start"},[row]));h.focus();say("Pick one");speakText("Pick one");
}
function speakText(t){try{var u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function begin(){st={part:1,i:0,words:shuffle(SETS[cfg.set])};round()}
function round(){
  if(st.i>=st.words.length){if(st.part==1){st.part=2;st.i=0;st.words=shuffle(st.words);partBreak();return}return finish()}
  var w=st.words[st.i];st.missed=false;st.locked=false;
  app.innerHTML="";
  var home=el("button",{cls:"icon","aria-label":"Home",text:"⌂"});home.addEventListener("click",startScreen);
  var dots=el("div",{cls:"dots","aria-hidden":"true"});st.words.forEach(function(_,k){dots.appendChild(el("span",{cls:"dot"+(k<st.i?" done":"")}))});
  var badge=el("span",{"aria-hidden":"true",cls:"icon",style:"display:flex;align-items:center;justify-content:center;border-style:dashed",text:st.part==1?"🖼":"🔤"});
  app.appendChild(el("div",{cls:"top"},[home,dots,badge]));
  var h=el("h1",{tabindex:"-1",cls:"sr",text:(st.part==1?"":"No picture. ")+"Find "+w+". "+(st.i+1)+" of "+st.words.length});
  app.appendChild(h);
  var cards=el("div",{cls:"cards"});
  if(st.part==1){var pc=el("button",{cls:"card pic","aria-label":"Picture of "+w},[el("img",{src:"img/"+w+".jpg",alt:""})]);pc.addEventListener("click",function(){sayWord(w)});cards.appendChild(pc)}
  w.split("").forEach(function(L){var b=el("button",{cls:"card let "+(VOW.indexOf(L)>=0?"vow":"cons"),"aria-label":L,text:L});b.addEventListener("click",function(){if(SOUNDS.indexOf(L)>=0)play("audio/sounds/"+L+".mp3")});cards.appendChild(b)});
  app.appendChild(el("div",{cls:"stand"},[cards,el("div",{cls:"base","aria-hidden":"true"})]));
  var sp=el("button",{cls:"speak","aria-label":"Hear the word",text:"🔊"});sp.addEventListener("click",function(){sayWord(w)});
  app.appendChild(sp);
  var others=shuffle(ALL.filter(function(x){return x!=w})).slice(0,cfg.choices-1);
  var row=el("div",{cls:"choices"});
  shuffle(others.concat([w])).forEach(function(x){var b=el("button",{cls:"ch","aria-label":x},[el("img",{src:"img/"+x+".jpg",alt:""})]);b.addEventListener("click",function(){pick(b,x,w)});row.appendChild(b)});
  app.appendChild(row);
  h.focus();
  setTimeout(function(){sayWord(w)},700);
}
function flash(ok){fbEl.className="fb on "+(ok?"good":"bad");fbEl.textContent=ok?"✓":"✗";setTimeout(function(){fbEl.className="fb"},ok?900:700)}
function pick(b,x,w){
  if(st.locked||b.disabled)return;
  if(x==w){st.locked=true;b.classList.add("yes");flash(true);tone(true);say("Right! "+w);setTimeout(function(){sayWord(w)},350);setTimeout(function(){st.i++;round()},1800)}
  else{b.classList.add("no");b.setAttribute("aria-disabled","true");b.setAttribute("aria-label",x+", not it");flash(false);tone(false);say("Try again");}
}
function partBreak(){
  app.innerHTML="";
  var h=el("h1",{tabindex:"-1",cls:"sr",text:"Great! Part 2. No pictures. Press play."});
  var p=el("button",{cls:"play","aria-label":"Play part 2",text:"▶"});p.addEventListener("click",round);
  app.appendChild(el("div",{cls:"start"},[h,el("div",{cls:"big","aria-hidden":"true",text:"⭐"}),p]));
  tone(true);h.focus();
}
function finish(){
  app.innerHTML="";
  var h=el("h1",{tabindex:"-1",cls:"sr",text:"All done! Great job."});
  var a=el("button",{cls:"play","aria-label":"Play again",text:"↻"});a.addEventListener("click",begin);
  var pk=el("button",{cls:"icon",style:"width:96px;height:96px;font-size:48px","aria-label":"Pick other words",text:"▦"});pk.addEventListener("click",picker);
  app.appendChild(el("div",{cls:"start"},[h,el("div",{cls:"big","aria-hidden":"true",text:"🏆"}),a,pk]));
  tone(true);h.focus();
}
startScreen();
</script>
</body>
</html>
