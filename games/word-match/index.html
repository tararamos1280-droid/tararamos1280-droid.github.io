<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Word Match Memory</title>
<style>
:root{--bg:#eef2f5;--ink:#141c28;--muted:#46505e;--line:#cfd7e2;--pri:#0f766e;--pri-d:#0a5550;--good:#146c35;--good-l:#e3f4e8;--back:#2f4858}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.35 "Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid #f59e0b;outline-offset:3px}
.hidden{display:none!important}
header{height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:26px;margin:0;color:var(--pri-d);flex:1}
#count{font-size:24px;font-weight:700}
#msg{font-size:24px;font-weight:800;color:var(--good);min-width:110px}
.tb{height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.tb svg{width:24px;height:24px}.tb.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{height:calc(100vh - 64px);padding:16px 20px}
.setup{max-width:900px;margin:0 auto}
.setup h2{font-size:24px;margin:14px 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.ch{min-width:200px;min-height:72px;padding:10px 22px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:24px;font-weight:700;text-align:left}
.ch small{display:block;font-size:16px;color:var(--muted);font-weight:400}
.ch.sel{border-color:var(--pri);background:#e3f3f1}
.go{margin-top:24px;min-height:76px;min-width:280px;border:0;border-radius:18px;background:var(--pri);color:#fff;font-size:28px;font-weight:800}
.grid{display:grid;gap:14px;height:100%;width:100%}
.card{position:relative;border:0;padding:0;background:none;perspective:900px;min-width:0;min-height:0}
.in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.bk{background:var(--back);box-shadow:0 3px 8px rgba(0,0,0,.18);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px)}
.fr{background:#fff;border:3px solid var(--line);transform:rotateY(180deg);padding:8%}
.fr svg{width:100%;height:100%;max-width:200px;max-height:200px}
.fr .w{font-size:var(--wf,56px);font-weight:700;letter-spacing:1px;color:#000}
.card.done .fr{border-color:var(--good);background:var(--good-l)}
.end{max-width:900px;margin:0 auto;text-align:center}
.end h2{font-size:38px;margin:10px 0}
.words{font-size:56px;font-weight:700;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 40px;margin:10px 0}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px;background:#fff}.sheet div{border:2px solid var(--line);border-radius:12px;text-align:center;font-size:26px;font-weight:700;padding:8px}.sheet svg{width:130px;height:130px;display:block;margin:0 auto}
</style></head><body>
<header><h1>Word Match Memory</h1><span id="msg" aria-live="polite"></span><span id="count" aria-live="polite"></span>
<button class="tb hidden" id="newset">New set</button>
<button class="tb" id="snd" aria-pressed="false" aria-label="Sound off"></button></header>
<main id="app"></main>
<!-- Word audio is reused from ../jeremy-reading/audio/words/ (see ../jeremy-reading/audio/CREDITS.txt). Pictures: original SVG drawings. -->
<script>
(function(){"use strict";
var K='stroke="#1c2533" stroke-width="3" stroke-linejoin="round"';
function svg(b){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+b+'</svg>'}
var PIC={
fish:svg('<path d="M20 50 L4 34 L9 50 L4 66Z" fill="#3b6f96" '+K+'/><path d="M18 50 C30 28 64 28 84 50 C64 72 30 72 18 50Z" fill="#4f8fbf" '+K+'/><path d="M40 33 Q50 20 60 32" fill="#3b6f96" '+K+'/><path d="M62 40 Q57 50 62 60" fill="none" '+K+'/><circle cx="73" cy="46" r="4" fill="#1c2533"/>'),
net:svg('<path d="M60 60 L94 94" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round"/><path d="M12 38 Q30 96 64 38" fill="#dfe7ee" '+K+'/><path d="M20 46 L52 70 M30 40 L58 60 M56 44 L28 70 M44 40 L20 58 M24 60 L54 58" stroke="#6b7280" stroke-width="2"/><ellipse cx="38" cy="38" rx="27" ry="13" fill="none" stroke="#1c2533" stroke-width="5"/>'),
rod:svg('<path d="M14 92 L88 10" stroke="#1c2533" stroke-width="4" stroke-linecap="round"/><path d="M14 92 L34 70" stroke="#7c4a1e" stroke-width="10" stroke-linecap="round"/><circle cx="38" cy="72" r="9" fill="#9aa5b4" '+K+'/><path d="M88 10 V62" stroke="#6b7280" stroke-width="1.5"/><path d="M88 62 v7 a5 5 0 0 1 -10 0" fill="none" stroke="#1c2533" stroke-width="3"/>'),
hook:svg('<circle cx="58" cy="12" r="7" fill="none" stroke="#4b5563" stroke-width="5"/><path d="M58 19 V64 A18 18 0 0 1 22 64 V52" fill="none" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/><path d="M22 50 L33 62" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>'),
worm:svg('<path d="M10 62 C20 38 34 38 42 56 S62 74 70 52 S86 36 92 48" fill="none" stroke="#1c2533" stroke-width="17" stroke-linecap="round"/><path d="M10 62 C20 38 34 38 42 56 S62 74 70 52 S86 36 92 48" fill="none" stroke="#d77a8c" stroke-width="11" stroke-linecap="round"/><path d="M36 46 l-4 6 M56 64 l4 -6" stroke="#a24a5c" stroke-width="3"/><circle cx="89" cy="45" r="2" fill="#1c2533"/>'),
boat:svg('<path d="M50 50 V14 L74 44Z" fill="#e5e7eb" '+K+'/><path d="M50 14 V52" stroke="#1c2533" stroke-width="3"/><path d="M8 54 H92 L78 76 H22Z" fill="#b45309" '+K+'/><path d="M14 62 H86" stroke="#7a3d00" stroke-width="3"/><path d="M4 86 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2b7bb9" stroke-width="4"/>'),
bug:svg('<path d="M32 46 L14 38 M30 60 L12 60 M32 74 L14 84 M68 46 L86 38 M70 60 L88 60 M68 74 L86 84 M45 22 L36 8 M55 22 L64 8" stroke="#1c2533" stroke-width="4" stroke-linecap="round"/><ellipse cx="50" cy="60" rx="21" ry="28" fill="#2f5d3a" '+K+'/><circle cx="50" cy="28" r="10" fill="#1c2533"/><path d="M50 36 V88" stroke="#1c2533" stroke-width="3"/>'),
cap:svg('<path d="M18 64 C18 26 82 26 82 64Z" fill="#1d4ed8" '+K+'/><path d="M66 64 H97 Q94 76 72 74 Q64 72 66 64Z" fill="#1e3a8a" '+K+'/><path d="M50 30 V64 M30 40 Q36 52 34 64 M70 40 Q64 52 66 64" stroke="#1e3a8a" stroke-width="2" fill="none"/><circle cx="50" cy="30" r="4" fill="#1e3a8a"/>'),
nut:svg('<polygon points="50,8 86,29 86,71 50,92 14,71 14,29" fill="#9aa5b4" stroke="#1c2533" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="50" r="18" fill="#fff" stroke="#1c2533" stroke-width="4"/><circle cx="50" cy="50" r="13" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>'),
bolt:svg('<path d="M28 8 H72 V28 H28Z" fill="#9aa5b4" '+K+'/><path d="M42 8 V28 M58 8 V28" stroke="#1c2533" stroke-width="2"/><rect x="40" y="28" width="20" height="64" fill="#c3cad4" '+K+'/><path d="M40 40 L60 36 M40 48 L60 44 M40 56 L60 52 M40 64 L60 60 M40 72 L60 68 M40 80 L60 76 M40 88 L60 84" stroke="#4b5563" stroke-width="2.5"/>'),
gas:svg('<path d="M68 34 L90 12" stroke="#1c2533" stroke-width="8" stroke-linecap="round"/><path d="M18 30 H66 L76 40 V90 H18Z" fill="#c62828" '+K+'/><path d="M26 30 V16 H56 V30 M34 30 V22 H48 V30" fill="none" stroke="#1c2533" stroke-width="3"/><path d="M28 46 L66 80 M66 46 L28 80" stroke="#8e1b1b" stroke-width="4"/>'),
oil:svg('<path d="M56 60 L90 28" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/><path d="M14 90 H66 V64 Q40 42 14 64Z" fill="#d4a017" '+K+'/><path d="M14 72 H66" stroke="#1c2533" stroke-width="2"/><path d="M90 38 Q83 50 90 55 Q97 50 90 38Z" fill="#7a4b00" stroke="#1c2533" stroke-width="2"/>'),
saw:svg('<path d="M6 30 H68 V62 L6 48Z" fill="#c9d0d9" '+K+'/><path d="M6 48 l4 6 l4 -4 l4 6 l4 -4 l4 6 l4 -4 l4 6 l4 -4 l4 6 l4 -4 l4 6 l4 -4 l4 6 l4 -4 l4 4" fill="none" stroke="#1c2533" stroke-width="2"/><path d="M66 22 H92 Q98 46 92 72 H66Z" fill="#8b4513" '+K+'/><ellipse cx="80" cy="47" rx="6" ry="12" fill="#fff" '+K+'/>'),
belt:svg('<rect x="2" y="40" width="96" height="20" rx="3" fill="#6b3f1d" '+K+'/><circle cx="16" cy="50" r="2.5" fill="#1c2533"/><circle cx="26" cy="50" r="2.5" fill="#1c2533"/><circle cx="36" cy="50" r="2.5" fill="#1c2533"/><rect x="58" y="31" width="22" height="38" rx="4" fill="none" stroke="#c9a227" stroke-width="6"/><path d="M60 50 H80" stroke="#c9a227" stroke-width="4"/>'),
mower:svg('<path d="M70 8 L54 54" stroke="#1c2533" stroke-width="5" stroke-linecap="round"/><path d="M62 10 H80" stroke="#1c2533" stroke-width="6" stroke-linecap="round"/><rect x="28" y="40" width="26" height="14" rx="3" fill="#9aa5b4" '+K+'/><path d="M10 54 H74 Q84 54 84 64 V70 H10Z" fill="#15803d" '+K+'/><circle cx="22" cy="76" r="10" fill="#1c2533"/><circle cx="22" cy="76" r="4" fill="#9aa5b4"/><circle cx="72" cy="76" r="10" fill="#1c2533"/><circle cx="72" cy="76" r="4" fill="#9aa5b4"/><path d="M2 94 H98" stroke="#65a30d" stroke-width="4"/>'),
wrench:svg('<g transform="rotate(45 50 50)"><path d="M34 20 A16 16 0 0 1 43 6 V18 H57 V6 A16 16 0 0 1 66 20 A16 16 0 0 1 57 34 V84 A7 7 0 0 1 43 84 V34 A16 16 0 0 1 34 20Z" fill="#9aa5b4" '+K+'/></g>'),
plug:svg('<rect x="44" y="2" width="12" height="10" fill="#6b7280" '+K+'/><path d="M40 12 H60 L58 44 H42Z" fill="#f4f1e8" '+K+'/><path d="M41 20 H59 M41 28 H59 M42 36 H58" stroke="#b8b2a0" stroke-width="2"/><path d="M30 44 H70 V60 H30Z" fill="#9aa5b4" '+K+'/><path d="M44 44 V60 M56 44 V60" stroke="#1c2533" stroke-width="2"/><rect x="40" y="60" width="20" height="24" fill="#c3cad4" '+K+'/><path d="M40 66 L60 63 M40 72 L60 69 M40 78 L60 75" stroke="#4b5563" stroke-width="2"/><path d="M50 84 V92 H60 V86" fill="none" stroke="#1c2533" stroke-width="3"/>'),
clamp:svg('<path d="M74 18 H36 Q20 18 20 34 V66 Q20 82 36 82 H74" fill="none" stroke="#1c2533" stroke-width="16"/><path d="M74 18 H36 Q20 18 20 34 V66 Q20 82 36 82 H74" fill="none" stroke="#1d4ed8" stroke-width="10"/><path d="M64 98 V40" stroke="#6b7280" stroke-width="7"/><path d="M64 46 V40" stroke="#1c2533" stroke-width="7"/><rect x="54" y="34" width="20" height="7" fill="#4b5563"/><path d="M50 98 H78" stroke="#1c2533" stroke-width="6" stroke-linecap="round"/>'),
drill:svg('<path d="M84 41 H98" stroke="#4b5563" stroke-width="4"/><rect x="74" y="35" width="11" height="13" fill="#4b5563" '+K+'/><path d="M12 28 H66 Q76 28 76 38 V46 Q76 54 66 54 H52 L56 84 H32 L30 54 H16 Q12 54 12 50Z" fill="#f59e0b" '+K+'/><path d="M30 54 H52" stroke="#1c2533" stroke-width="2"/><rect x="24" y="84" width="40" height="12" rx="2" fill="#1c2533"/><rect x="40" y="58" width="8" height="8" rx="2" fill="#1c2533"/>'),
float:svg('<path d="M50 30 V8" stroke="#1c2533" stroke-width="4" stroke-linecap="round"/><path d="M26 52 A24 24 0 0 1 74 52Z" fill="#dc2626" '+K+'/><path d="M26 52 A24 24 0 0 0 74 52Z" fill="#fff" '+K+'/><path d="M2 70 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2b7bb9" stroke-width="4"/>')};
var SETS={fishing:{name:"Fishing",words:["fish","net","rod","hook","worm","boat","float","cap"]},
 fixit:{name:"Fix-It",words:["nut","bolt","saw","belt","gas","mower","wrench","drill"]},
 mixed:{name:"Mixed",words:null}};
var SIZES={easy:{name:"Easy",n:4},medium:{name:"Medium",n:6},hard:{name:"Hard",n:8}};
var ON='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var OFF='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var app=document.getElementById("app"),cnt=document.getElementById("count"),msg=document.getElementById("msg"),sndB=document.getElementById("snd"),newB=document.getElementById("newset");
var cfg={set:"fishing",size:"medium",wordsOnly:false},sound=false,G=null;
try{var c=JSON.parse(localStorage.getItem("wordMatch.v1"));if(c){cfg.set=c.set||cfg.set;cfg.size=c.size||cfg.size;cfg.wordsOnly=!!c.wordsOnly}}catch(e){}
function saveCfg(){try{localStorage.setItem("wordMatch.v1",JSON.stringify(cfg))}catch(e){}}
var player=document.createElement("audio");player.preload="auto";document.body.appendChild(player);
function say(w){if(!sound)return;try{player.src="../jeremy-reading/audio/words/"+w+".mp3";var p=player.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function drawSnd(){sndB.innerHTML=(sound?ON:OFF)+(sound?"On":"Off");sndB.classList.toggle("on",sound);sndB.setAttribute("aria-pressed",sound);sndB.setAttribute("aria-label",sound?"Sound on":"Sound off")}
sndB.onclick=function(){sound=!sound;drawSnd()};drawSnd();
newB.onclick=setup;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function setup(){G=null;newB.classList.add("hidden");cnt.textContent="";msg.textContent="";
 function opts(obj,key,sub){return Object.keys(obj).map(function(k){return'<button class="ch'+(cfg[key]===k?' sel':'')+'" data-k="'+key+'" data-v="'+k+'">'+obj[k].name+'<small>'+sub(k)+'</small></button>'}).join("")}
 app.innerHTML='<div class="setup"><h2>Pick a word set</h2><div class="row">'+opts(SETS,"set",function(k){return SETS[k].words?SETS[k].words.slice(0,6).join(", ")+"…":"some of each"})+'</div>'+
 '<h2>Pick a size</h2><div class="row">'+opts(SIZES,"size",function(k){return SIZES[k].n+" pairs ("+SIZES[k].n*2+" cards)"})+'</div>'+
 '<h2>Cards</h2><div class="row"><button class="ch'+(!cfg.wordsOnly?' sel':'')+'" data-k="wordsOnly" data-v="0">Word + picture<small>match a word to its picture</small></button><button class="ch'+(cfg.wordsOnly?' sel':'')+'" data-k="wordsOnly" data-v="1">Words only<small>match a word to the same word</small></button></div>'+
 '<button class="go" id="go">Start</button></div>';
 app.querySelectorAll(".ch").forEach(function(b){b.onclick=function(){var k=b.dataset.k;cfg[k]=k==="wordsOnly"?b.dataset.v==="1":b.dataset.v;saveCfg();setup()}});
 document.getElementById("go").onclick=start}

function start(){var n=SIZES[cfg.size].n,pool=SETS[cfg.set].words;
 if(!pool){var a=shuf(SETS.fishing.words),b=shuf(SETS.fixit.words);pool=[];for(var i=0;i<8;i++)pool.push(i%2?b[i>>1]:a[i>>1])}
 var words=shuf(pool).slice(0,n),cards=[];
 words.forEach(function(w){cards.push({w:w,k:"word"});cards.push({w:w,k:cfg.wordsOnly?"word":"pic"})});
 G={words:words,cards:shuf(cards),open:[],lock:false,found:0,n:n};newB.classList.remove("hidden");render()}
function render(){var n=G.cards.length,cols=n===8?4:n===12?6:8,rows=2;
 var cw=(window.innerWidth-40-(cols-1)*14)/cols,ch=(window.innerHeight-64-32-14)/rows;
 var wf=Math.floor(Math.min(cw/3.6,ch/2.6,84));
 app.innerHTML='<div class="grid" id="grid" style="grid-template-columns:repeat('+cols+',1fr);grid-template-rows:repeat('+rows+',1fr);--wf:'+wf+'px">'+G.cards.map(function(c,i){
  return'<button class="card" data-i="'+i+'" aria-label="Card '+(i+1)+', face down"><div class="in"><div class="f bk"></div><div class="f fr">'+(c.k==="pic"?PIC[c.w]:'<span class="w">'+c.w+'</span>')+'</div></div></button>'}).join("")+'</div>';
 app.querySelectorAll(".card").forEach(function(b){b.addEventListener("click",function(){tap(+b.dataset.i,b)})});upd()}
function upd(){cnt.textContent=G.found+" of "+G.n+" matched"}
function tap(i,b){var c=G.cards[i];if(G.lock||c.done||c.up)return;
 c.up=true;b.classList.add("up");b.setAttribute("aria-label",c.k==="pic"?"Picture: "+c.w:"Word: "+c.w);if(c.k==="word")say(c.w);
 G.open.push(i);msg.textContent="";if(G.open.length<2)return;
 var a=G.cards[G.open[0]],z=G.cards[G.open[1]],ia=G.open[0],iz=G.open[1];G.open=[];
 if(a.w===z.w){a.done=z.done=true;G.found++;[ia,iz].forEach(function(k){app.querySelector('[data-i="'+k+'"]').classList.add("done")});msg.textContent="Match!";say(a.w);upd();
  if(G.found===G.n){G.lock=true;setTimeout(end,1200)}}
 else{G.lock=true;setTimeout(function(){[ia,iz].forEach(function(k){G.cards[k].up=false;var e=app.querySelector('[data-i="'+k+'"]');if(e){e.classList.remove("up");e.setAttribute("aria-label","Card "+(k+1)+", face down")}});G.lock=false},1500)}}
function end(){msg.textContent="";newB.classList.add("hidden");
 app.innerHTML='<div class="end"><h2>All matched, nice work Jeremy!</h2><p>Write these in your book:</p><div class="words">'+G.words.map(function(w){return'<span>'+w+'</span>'}).join("")+'</div><div class="row" style="justify-content:center"><button class="go" id="again">Play again</button><button class="go" id="ns" style="background:#fff;color:var(--pri-d);border:3px solid var(--pri)">New set</button></div></div>';
 document.getElementById("again").onclick=start;document.getElementById("ns").onclick=setup}
window.addEventListener("resize",function(){if(G&&!G.lock&&app.querySelector("#grid")){var s=G;render();s.cards.forEach(function(c,i){var e=app.querySelector('[data-i="'+i+'"]');if(c.done)e.classList.add("done");else if(c.up)e.classList.add("up")})}});
window.__wm={pics:PIC,sets:SETS,state:function(){return G}};
if(/[?&]pics=1/.test(location.search)){var all=SETS.fishing.words.concat(SETS.fixit.words);app.style.height="auto";document.body.style.overflow="auto";app.innerHTML='<div class="sheet">'+all.map(function(w){return'<div>'+PIC[w]+w+'</div>'}).join("")+'</div>'}else setup();
})();
</script></body></html>
