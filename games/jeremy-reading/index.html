<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>Word Shop — Reading Practice</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#141c28;--muted:#3f4a5a;--line:#cfd7e2;--pri:#0f766e;--pri-d:#0a5550;--pri-l:#e3f3f1;--good:#146c35;--good-l:#e6f5eb;--bad:#a3221a;--bad-l:#fdecea;--gold:#b45309;--r:20px;--sh:0 4px 16px rgba(20,30,50,.08)}
.hidden{display:none !important}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
:focus-visible{outline:4px solid #f59e0b;outline-offset:3px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
#title{font-weight:800;font-size:22px;color:var(--pri-d);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-user-select:none}
.streak{font-weight:800;font-size:18px;color:var(--gold);white-space:nowrap}
.xbtn{min-width:52px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:22px}
.bar{height:16px;border-radius:10px;background:#d9e0e8;overflow:hidden;margin:12px 16px 0}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
h1{font-size:30px;line-height:1.2;margin:4px 0 10px}h2{font-size:25px;margin:0 0 10px}p{margin:0 0 10px}
.muted{color:var(--muted)}
.big{min-height:64px;width:100%;border:0;border-radius:18px;background:var(--pri);color:#fff;font-weight:800;font-size:23px;padding:12px 18px;margin-top:8px;box-shadow:0 4px 0 var(--pri-d)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.big.alt{background:#fff;color:var(--pri-d);border:3px solid var(--pri);box-shadow:none}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;min-height:84px}
.lesson .ic{font-size:40px}.lesson b{display:block;font-size:23px}.lesson small{font-size:17px;color:var(--muted)}
.stars{color:var(--gold);font-size:22px;letter-spacing:2px;white-space:nowrap}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.spk{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:34px;box-shadow:0 4px 0 var(--pri-d)}
.spk.sm{width:56px;height:56px;font-size:26px}
.ask{font-size:23px;font-weight:700}
.word{font-size:52px;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{min-height:96px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:44px;font-weight:800;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;padding:6px}
.opt svg{width:58px;height:58px}
.opt.ok{border-color:var(--good);background:var(--good-l);box-shadow:0 4px 0 var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-l);animation:shake .3s}
.opt.hint{border-color:var(--good);border-style:dashed}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:60px;margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:800;font-size:22px}
.fb.ok{background:var(--good-l);color:var(--good)}.fb.no{background:var(--bad-l);color:var(--bad)}
.pond{background:linear-gradient(#bfe3f2,#7cc2e0);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.fish{align-self:flex-start;border:0;background:none;padding:0;min-height:72px;animation:swim 1s ease-out both}
.fish:nth-child(2){align-self:center;animation-delay:.15s}.fish:nth-child(3){align-self:flex-end;animation-delay:.3s}
.fish span{display:inline-flex;align-items:center;gap:6px;background:#fff7d6;border:3px solid #a16207;border-radius:40px 60px 60px 40px;padding:8px 22px 8px 16px;font-size:32px;font-weight:800;animation:bob 2s ease-in-out infinite}
.fish.ok span{background:var(--good-l);border-color:var(--good)}.fish.no span{background:var(--bad-l);border-color:var(--bad)}.fish.hint span{border-style:dashed;border-color:var(--good)}
@keyframes swim{from{transform:translateX(-120vw)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-5px)}}
.mower{display:flex;justify-content:center;margin-bottom:8px}.mower svg{width:200px;height:120px}
.part{fill:#c9ced6;transition:fill .3s}.part.fixed{fill:#15803d}
.slots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.slot{width:58px;height:66px;border-bottom:5px solid var(--ink);font-size:44px;font-weight:800;text-align:center}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.tiles .opt{width:76px;min-height:80px;font-size:40px}
.book{font-size:46px;font-weight:800;line-height:1.5;columns:2;text-align:center;margin:8px 0 14px}
.result{text-align:center}.result .stars{font-size:52px}
table{width:100%;border-collapse:collapse;font-size:17px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.danger{background:var(--bad);box-shadow:0 4px 0 #6f1510}
</style></head><body>
<div class="top"><div id="title" role="button" tabindex="0">Word Shop</div><div class="streak" id="streak"></div><button class="xbtn hidden" id="quit" aria-label="Quit lesson">✕</button></div>
<div class="bar hidden" id="bar"><i id="barfill"></i></div>
<main id="app" aria-live="polite"></main>
<script>
(function(){
"use strict";
var KEY="jeremyReading.v1";
var PIC={
fish:"🐟",net:"🥅",rod:"🎣",bait:"🪱",hook:"🪝",wet:"💧",bug:"🐛",fin:"🦈",
bolt:"🔩",gas:"⛽",oil:"🛢️",cut:"✂️",fix:"🔧",tool:"🧰",
nut:'<svg viewBox="0 0 60 60" aria-hidden="true"><polygon points="30,4 53,17 53,43 30,56 7,43 7,17" fill="#8a96a8" stroke="#1c2533" stroke-width="3"/><circle cx="30" cy="30" r="10" fill="#fff" stroke="#1c2533" stroke-width="3"/></svg>',
mow:'<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M40 8 L30 30" stroke="#1c2533" stroke-width="4" stroke-linecap="round"/><rect x="8" y="28" width="40" height="16" rx="5" fill="#15803d" stroke="#1c2533" stroke-width="3"/><circle cx="15" cy="48" r="7" fill="#1c2533"/><circle cx="42" cy="48" r="7" fill="#1c2533"/><path d="M2 58 h56" stroke="#65a30d" stroke-width="4"/></svg>',
belt:'<svg viewBox="0 0 60 60" aria-hidden="true"><rect x="2" y="22" width="56" height="16" rx="3" fill="#7c4a1e" stroke="#1c2533" stroke-width="3"/><rect x="20" y="17" width="18" height="26" rx="3" fill="none" stroke="#d4a017" stroke-width="5"/></svg>',
fresh:"🥬",spark:"⚡",plug:"🔌",trim:"✂️"};
var ALT={fresh:["🍞","🧱"],spark:["💧","🪨"],plug:["🔑","🧲"],trim:["🔨","🪣"]};
var LESSONS=[
{id:"fish",name:"Fishing",icon:"🎣",words:["fish","net","rod","bait","hook","wet","bug","fin"],plan:["sound","sound","sound","pic","pic","pic","catch","catch","catch"]},
{id:"fix",name:"Fix-It Shop",icon:"🔧",words:["nut","bolt","gas","oil","cut","fix","mow","tool","belt"],plan:["build","build","build","sound","sound","sound","pic","pic","pic"]}];
var BONUS=["fresh","spark","plug","trim"];
var PRAISE=["Nice job, Jeremy!","That's it!","Right on!","Good work, Jeremy!","You got it!"];
var app=document.getElementById("app"),bar=document.getElementById("bar"),barfill=document.getElementById("barfill"),quitB=document.getElementById("quit");

function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}return{v:1,stars:{},words:{},bonus:[],days:[],booked:{}}}
var S=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function markDay(){var t=today();if(S.days.indexOf(t)<0){S.days.push(t);save()}}
function streak(){var set={},n=0,d=new Date();S.days.forEach(function(x){set[x]=1});
 function k(dt){return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2)}
 if(!set[k(d)])d.setDate(d.getDate()-1);while(set[k(d)]){n++;d.setDate(d.getDate()-1)}return n}
function showStreak(){var n=streak();document.getElementById("streak").textContent=n?"🔥 "+n+" day"+(n>1?"s":""):""}

// speech
var voice=null;function pickVoice(){try{var v=speechSynthesis.getVoices().filter(function(x){return/^en[-_]US/i.test(x.lang)});voice=v.filter(function(x){return x.localService})[0]||v[0]||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t){if(!("speechSynthesis" in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.75;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function letterSay(l,w){return l+", as in "+w}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function el(h){app.innerHTML=h;window.scrollTo(0,0)}
function rec(w,ok){var r=S.words[w]||(S.words[w]={tries:0,first:0});r.tries++;if(ok)r.first++;save()}

// ---- home
function home(){quitB.classList.add("hidden");bar.classList.add("hidden");showStreak();
 var h='<div class="card"><h1>Hi, Jeremy.</h1><p class="muted">Pick a lesson. Tap 🔊 any time to hear it again. Turn your sound on.</p></div>';
 LESSONS.forEach(function(L,i){var st=S.stars[L.id]||0;
  h+='<button class="lesson" data-l="'+i+'"><span class="ic" aria-hidden="true">'+L.icon+'</span><span style="flex:1"><b>'+L.name+'</b><small>'+L.words.length+' words</small></span><span class="stars" aria-label="'+st+' of 3 stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</span></button>'});
 el(h);app.querySelectorAll(".lesson").forEach(function(b){b.onclick=function(){say("");startLesson(+b.dataset.l)}})}

// ---- lesson engine
var R=null;
function startLesson(i){var L=LESSONS[i];markDay();showStreak();
 var qs=[],pool={};L.plan.forEach(function(t){var p=pool[t]||(pool[t]=shuf(L.words));qs.push({type:t,word:p.shift()||L.words[0]})});
 R={L:L,qs:qs,i:0,miss:0,bonus:false};quitB.classList.remove("hidden");bar.classList.remove("hidden");nextQ()}
function startBonus(){markDay();R={L:R.L,qs:shuf(BONUS).map(function(w){return{type:"bpic",word:w}}),i:0,miss:0,bonus:true,res:{}};
 quitB.classList.remove("hidden");bar.classList.remove("hidden");nextQ()}
function prog(){barfill.style.width=Math.round(100*R.i/R.qs.length)+"%"}
function nextQ(){prog();if(R.i>=R.qs.length)return R.bonus?bonusDone():lessonDone();var q=R.qs[R.i];app.dataset.w=q.word;
 ({sound:qSound,pic:qPic,bpic:qPic,catch:qCatch,build:qBuild})[q.type](q)}
function advance(){R.i++;setTimeout(nextQ,1100)}

// generic choice handler: misses then reveal
function choices(q,correctVal,onRight){var misses=0,done=false;
 app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){if(done||b.classList.contains("no"))return;var fb=document.getElementById("fb");
  if(b.dataset.v===correctVal){done=true;b.classList.add("ok");
   if(q.type==="bpic")R.res[q.word]=misses===0;else if(misses===0)rec(q.word,true);
   fb.className="fb ok";fb.textContent=misses===0?PRAISE[Math.floor(Math.random()*PRAISE.length)]:"Got it. Keep going.";
   onRight&&onRight();advance()}
  else{misses++;R.miss++;b.classList.add("no");if(misses===1&&q.type!=="bpic")rec(q.word,false);
   fb.className="fb no";
   if(misses>=2){var c=app.querySelector('[data-v="'+correctVal+'"]');c.classList.add("hint");fb.textContent="Try again. It's the one with the dashed line.";}
   else fb.textContent="Try again.";}
 }})}
function spkBtn(text,ask){return '<div class="prompt"><button class="spk" id="spk" aria-label="Play sound">🔊</button><div class="ask">'+ask+'</div></div>'}
function wireSpk(t){document.getElementById("spk").onclick=function(){say(t)};setTimeout(function(){say(t)},250)}

function qSound(q){var w=q.word,first=w[0],letters="abcdefghijklmnoprstuw".split("").filter(function(c){return c!==first});
 var opts=shuf([first].concat(shuf(letters).slice(0,2)));var t=w+". What sound does "+w+" start with?";
 el('<div class="card">'+spkBtn(t,"Tap the first sound you hear.")+'<div class="grid">'+opts.map(function(c){return'<button class="opt" data-v="'+c+'" aria-label="letter '+c+'">'+c+'</button>'}).join("")+'</div><div class="fb" id="fb"></div></div>');
 wireSpk(t);choices(q,first,function(){say(letterSay(first,w))})}

function qPic(q){var w=q.word,opts;
 if(q.type==="bpic")opts=shuf([{v:w,p:PIC[w]}].concat(ALT[w].map(function(p,i){return{v:"x"+i,p:p}})));
 else{var others=shuf(R.L.words.filter(function(x){return x!==w&&PIC[x]!==PIC[w]})).slice(0,2);opts=shuf([w].concat(others)).map(function(x){return{v:x,p:PIC[x]}})}
 el('<div class="card">'+(q.type==="bpic"?'<p class="ask">⭐ Bonus. Read the word. Tap the picture.</p>':'<p class="ask">Read the word. Tap the picture.</p>')+'<div class="word">'+esc(w)+'</div><div class="grid">'+opts.map(function(o){return'<button class="opt" data-v="'+o.v+'" aria-label="picture '+(o.v===w?"":"other ")+'">'+o.p+'</button>'}).join("")+'</div><div class="fb" id="fb"></div></div>');
 choices(q,w,function(){say(w)})}

function qCatch(q){var w=q.word,others=shuf(R.L.words.filter(function(x){return x!==w})).slice(0,2),opts=shuf([w].concat(others));var t="Catch the fish that says: "+w;
 el('<div class="card">'+spkBtn(t,"Catch the fish that says the word.")+'<div class="pond">'+opts.map(function(x){return'<button class="fish" data-v="'+x+'"><span>🐟 '+esc(x)+'</span></button>'}).join("")+'</div><div class="fb" id="fb"></div></div>');
 wireSpk(t);choices(q,w)}

function qBuild(q){var w=q.word,L=w.split(""),pos=0,missAt=0,firstOk=true;
 var extra=shuf("abdegiklmnprstu".split("").filter(function(c){return L.indexOf(c)<0})).slice(0,2);
 var tiles=shuf(L.concat(extra).map(function(c,i){return{c:c,i:i}}));var t="Spell "+w+". "+w;
 var parts='<rect class="part" id="p0" x="40" y="55" width="120" height="35" rx="8"/><circle class="part" id="p1" cx="60" cy="98" r="16"/><circle class="part" id="p2" cx="140" cy="98" r="16"/><rect class="part" id="p3" x="150" y="10" width="10" height="50" rx="4"/><rect class="part" id="p4" x="80" y="38" width="40" height="18" rx="4"/>';
 el('<div class="card">'+spkBtn(t,"Fix the mower. Tap the letters in order.")+'<div class="mower"><svg viewBox="0 0 200 120" aria-hidden="true">'+parts+'</svg></div><div class="slots">'+L.map(function(_,i){return'<div class="slot" id="s'+i+'"></div>'}).join("")+'</div><div class="tiles">'+tiles.map(function(o){return'<button class="opt" data-c="'+o.c+'" aria-label="letter '+o.c+'">'+o.c+'</button>'}).join("")+'</div><div class="fb" id="fb"></div></div>');
 wireSpk(t);
 app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){if(pos>=L.length||b.disabled)return;var fb=document.getElementById("fb");
  if(b.dataset.c===L[pos]){b.disabled=true;b.classList.add("ok");b.style.visibility="hidden";document.getElementById("s"+pos).textContent=L[pos];
   var np=Math.ceil(5*(pos+1)/L.length);for(var k=0;k<np;k++)document.getElementById("p"+k).classList.add("fixed");
   app.querySelectorAll(".opt.no,.opt.hint").forEach(function(x){x.classList.remove("no","hint")});missAt=0;pos++;fb.className="fb ok";
   if(pos===L.length){rec(w,firstOk);fb.textContent=firstOk?"Mower fixed! Nice job, Jeremy!":"Mower fixed. Keep going.";say(w);advance()}else fb.textContent="Good. Next letter.";}
  else{firstOk=false;missAt++;R.miss++;b.classList.add("no");fb.className="fb no";
   if(missAt>=2){var c=[].filter.call(app.querySelectorAll("[data-c]"),function(x){return x.dataset.c===L[pos]&&!x.disabled})[0];c.classList.add("hint");fb.textContent="Try again. Next letter is "+L[pos]+" (dashed).";}
   else fb.textContent="Try again.";}
 }})}

function lessonDone(){barfill.style.width="100%";var st=R.miss<=1?3:R.miss<=3?2:1;if(st>(S.stars[R.L.id]||0))S.stars[R.L.id]=st;save();quitB.classList.add("hidden");
 var words=R.L.words;
 el('<div class="card result"><h1>Nice job, Jeremy!</h1><div class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><p>'+R.L.name+' done.</p></div><div class="card"><h2>📓 Write these in your book</h2><div class="book">'+words.map(function(w){return'<div>'+esc(w)+'</div>'}).join("")+'</div><button class="big" id="wrote">I wrote them</button></div>');
 document.getElementById("wrote").onclick=function(){S.booked[R.L.id]=today();save();offerBonus()}}
function offerBonus(){el('<div class="card"><h2>⭐ Want a bonus?</h2><p>4 harder words. Just for fun. No pressure.</p><button class="big" id="by">Try the bonus</button><button class="big alt" id="bn">Not now</button></div>');
 document.getElementById("by").onclick=startBonus;document.getElementById("bn").onclick=home}
function bonusDone(){S.bonus.push({date:today(),after:R.L.name,res:R.res});save();quitB.classList.add("hidden");barfill.style.width="100%";
 el('<div class="card result"><h1>Bonus done!</h1><p>Strong work, Jeremy.</p><button class="big" id="hm">Back to lessons</button></div>');document.getElementById("hm").onclick=home}
quitB.onclick=function(){home()};

// ---- coach view
function coach(){quitB.classList.add("hidden");bar.classList.add("hidden");
 var rows=Object.keys(S.words).map(function(w){var r=S.words[w];return'<tr><td>'+esc(w)+'</td><td>'+r.first+' / '+r.tries+'</td><td>'+Math.round(100*r.first/r.tries)+'%</td></tr>'}).join("")||'<tr><td colspan="3">No data yet</td></tr>';
 var b=S.bonus.map(function(x){return'<tr><td>'+x.date+'<br><small>after '+esc(x.after)+'</small></td><td>'+Object.keys(x.res).map(function(w){return esc(w)+(x.res[w]?" ✔":" ✘")}).join(", ")+'</td></tr>'}).join("")||'<tr><td colspan="2">Not tried yet</td></tr>';
 el('<div class="card"><h2>Coach view</h2><p class="muted">First-try correct / times asked. Saved on this phone only.</p><table><tr><th>Word</th><th>First try</th><th>%</th></tr>'+rows+'</table></div><div class="card"><h2>Level Up Check</h2><p class="muted">✔ = right on first try</p><table>'+b+'</table></div><div class="card"><h2>Days played</h2><p>'+(S.days.join(", ")||"None yet")+'</p><p>Stars: '+LESSONS.map(function(L){return L.name+" "+(S.stars[L.id]||0)}).join(" · ")+'</p></div><button class="big alt" id="back">Back</button><button class="big danger" id="reset">Reset all progress</button>');
 document.getElementById("back").onclick=home;
 document.getElementById("reset").onclick=function(){if(confirm("Erase all of Jeremy's progress on this phone?")){localStorage.removeItem(KEY);S=load();home()}}}
var taps=0,tt;var title=document.getElementById("title");
title.addEventListener("click",function(){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},2000);if(taps>=5){taps=0;coach()}});
if(/[?&]coach=1/.test(location.search))coach();else home();
})();
</script></body></html>
