<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tank Talk</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#0b2233;color:#fff;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}
#bar{display:flex;gap:8px;padding:8px;justify-content:space-between;align-items:center}
#bar h1{margin:0;font-size:clamp(20px,4vw,32px);letter-spacing:1px;text-shadow:0 2px 0 #052;display:flex;align-items:center;gap:6px}
.tools{display:flex;gap:8px}
.tbtn{min-width:64px;min-height:56px;border-radius:16px;border:3px solid #cfe9ff;background:linear-gradient(#1f6a99,#124566);color:#fff;font-size:16px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px 8px}
.tbtn svg{width:28px;height:28px}
.tbtn[aria-pressed=true]{background:linear-gradient(#666,#333);border-style:dashed}
#tankWrap{position:relative;flex:1 1 52%;min-height:200px;margin:0 8px;border-radius:18px;overflow:hidden;border:10px solid #2b3a44;box-shadow:inset 0 0 0 2px #8ab,0 6px 18px #0008}
#tankBg,#tankFx{position:absolute;inset:0;width:100%;height:100%}
#tankItems{position:absolute;inset:0}
.swimmer{position:absolute;will-change:transform}
.swimmer .flipper{animation:none}
.swimmer svg{width:100%;height:100%;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.tail{transform-box:fill-box;transform-origin:right center;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{to{transform:skewY(12deg) scaleX(.85)}}
.fin{transform-box:fill-box;transform-origin:left top;animation:flap .8s ease-in-out infinite alternate}
@keyframes flap{to{transform:rotate(14deg)}}
.plant{transform-box:fill-box;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.ray{animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.08}to{opacity:.28}}
.bubble{animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-110%)}}
.newItem{animation:pop 1.2s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1)}}
#play{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;align-items:center}
#picCard{width:clamp(120px,22vw,200px);aspect-ratio:1;border-radius:24px;background:radial-gradient(circle at 40% 30%,#fffef6,#e9e1c8);border:5px solid #f5d77a;box-shadow:0 6px 0 #a8862a;cursor:pointer;position:relative;padding:8px}
#picCard svg{width:100%;height:100%}
#picCard .ear{position:absolute;right:-10px;bottom:-10px;width:48px;height:48px;border-radius:50%;background:#1f6a99;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
#right{display:flex;flex-direction:column;gap:10px;min-width:0}
#mascotRow{display:flex;align-items:center;gap:8px;min-height:60px}
#mascot{width:clamp(90px,16vw,140px);height:auto;cursor:pointer}
#mascot.flip{animation:flip 1.4s ease-in-out}
@keyframes flip{0%{transform:none}25%{transform:translateY(-30px) rotate(-180deg) scale(1.2)}50%{transform:translateY(-40px) rotate(-360deg) scale(1.3)}70%{transform:translateY(0) scaleY(.7) scaleX(1.3)}85%{transform:scaleY(1.15) scaleX(.9)}100%{transform:none}}
#mascot.shake{animation:nod 1s ease-in-out}
@keyframes nod{30%{transform:rotate(6deg)}60%{transform:rotate(-6deg)}}
#bubbleSay{background:#fff;color:#123;border-radius:20px;padding:8px 14px;font-size:clamp(18px,3vw,26px);font-weight:bold;position:relative;display:flex;align-items:center;gap:6px}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{position:relative;min-height:96px;border-radius:22px;border:5px solid #fff;background:linear-gradient(#ffffff,#dfeefa);color:#123;font-size:clamp(34px,7vw,60px);font-weight:900;cursor:pointer;box-shadow:0 7px 0 #6b8aa3;letter-spacing:2px;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;text-transform:lowercase;padding:8px 58px 8px 8px}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 #6b8aa3}
.choice.right{border-color:#1a8a3a;background:linear-gradient(#eaffef,#b8f5c8);outline:6px solid #1a8a3a}
.choice.right::after{content:"✔";position:absolute;left:10px;top:4px;font-size:34px;color:#1a8a3a}
.choice.tryagain{animation:wob .5s;border-style:dashed;opacity:.75}
@keyframes wob{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.say{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:#1f6a99;border:3px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.say svg,.ear svg{width:26px;height:26px}
#start{position:fixed;inset:0;background:radial-gradient(circle,#13527acc,#04121ccc);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;gap:16px}
#start button{font-size:40px;padding:20px 50px;border-radius:30px;border:6px solid #fff;background:linear-gradient(#3fd06a,#178a3b);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 8px 0 #0b5022;display:flex;align-items:center;gap:12px}
#start svg.big{width:min(60vw,300px)}
@media (max-width:640px){#play{grid-template-columns:1fr;justify-items:center}#right{width:100%}#tankWrap{flex-basis:40%}#mascotRow{justify-content:center}.choice{min-height:84px}}
@media (max-height:560px) and (min-width:641px){#tankWrap{flex-basis:38%}}
</style></head>
<body>
<div id="app">
 <div id="bar">
  <h1>Tank Talk</h1>
  <div class="tools">
   <button class="tbtn" id="repeatBtn" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="#fff"/></svg>Repeat</button>
   <button class="tbtn" id="stopBtn" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="#fff"/></svg>Stop</button>
   <button class="tbtn" id="soundBtn" aria-label="Sound on or off" aria-pressed="false"><svg viewBox="0 0 24 24" id="soundIcon"></svg>Sound</button>
  </div>
 </div>
 <div id="tankWrap">
  <svg id="tankBg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="tankItems"></div>
  <svg id="tankFx" viewBox="0 0 1000 500" preserveAspectRatio="none" style="pointer-events:none"></svg>
 </div>
 <div id="play">
  <div id="picCard" role="button" aria-label="Hear the word"><div id="pic"></div><div class="ear"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="#fff"/></svg></div></div>
  <div id="right">
   <div id="mascotRow"><svg id="mascot" viewBox="-20 -30 260 190"></svg><div id="bubbleSay" aria-live="polite"></div></div>
   <div id="choices"></div>
  </div>
 </div>
</div>
<div id="start"><svg class="big" viewBox="-20 -30 260 190" id="startFish"></svg><button id="goBtn" aria-label="Start"><svg viewBox="0 0 24 24" width="44" height="44"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>Go</button></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="#fff"/></svg>';
let uid=0;const U=p=>p+(++uid);

/* ---------- FISH ART ---------- */
const SPECIES={
 gus:{a:'#ffb347',b:'#ff6a00',c:'#c43d00',fin:'#ffd27a',stripe:null,shape:'round',name:'Gus'},
 goldfish:{a:'#ffd36b',b:'#ff8c1a',c:'#c25a00',fin:'#ffb25a',shape:'gold'},
 clown:{a:'#ffa64d',b:'#ff6d00',c:'#a63c00',fin:'#ff8a33',stripe:'#fff',stripeEdge:'#111',shape:'round'},
 betta:{a:'#8a7dff',b:'#3b2bd1',c:'#1c1270',fin:'#d04cff',shape:'betta'},
 angel:{a:'#f3f3f3',b:'#c9c9c9',c:'#555',fin:'#e8e8e8',stripe:'#222',shape:'angel'},
 tetra:{a:'#7fe8ff',b:'#0aa0d8',c:'#073a66',fin:'#bdf3ff',neon:true,shape:'slim'},
 puffer:{a:'#fff1b3',b:'#e6c44d',c:'#7a6514',fin:'#fff3c4',spots:true,shape:'puff'},
 tang:{a:'#4aa8ff',b:'#0b4fd6',c:'#061a5c',fin:'#ffe14a',shape:'round',tang:true},
};
function fishSVG(k,opts={}){
 const s=SPECIES[k],g=U('g'),f=U('f'),sc=U('s'),sh=U('h');
 let body,tail,dor,pec,extra='';
 if(s.shape==='betta'){
  body='M40 70 C60 30 150 35 175 65 C185 75 175 95 150 100 C110 110 60 105 40 70Z';
  tail='M45 70 C0 10 -15 40 -10 70 C-15 110 5 140 45 75Z';
  dor='M80 45 C100 -10 150 0 150 50Z';pec='M110 100 C100 150 150 150 140 100Z';
 }else if(s.shape==='angel'){
  body='M50 70 C70 30 150 25 175 65 C180 80 160 105 120 110 C80 112 60 100 50 70Z';
  tail='M55 70 C25 40 15 45 18 70 C15 95 25 100 55 72Z';
  dor='M95 40 C95 -30 120 -40 150 45Z';pec='M95 100 C90 180 115 190 140 104Z';
 }else if(s.shape==='slim'){
  body='M40 72 C60 50 150 48 180 68 C185 74 180 82 160 88 C110 98 60 94 40 72Z';
  tail='M45 72 C20 50 10 50 12 72 C10 94 20 94 45 74Z';
  dor='M100 54 C105 35 125 35 130 55Z';pec='M110 86 C108 104 125 104 125 88Z';
 }else if(s.shape==='puff'){
  body='M45 70 C45 15 170 10 178 70 C175 130 50 128 45 70Z';
  tail='M50 70 C30 55 22 58 24 70 C22 82 30 85 50 72Z';
  dor='M100 22 C110 0 130 5 130 22Z';pec='M118 80 C125 98 140 96 138 80Z';
  extra=Array.from({length:14},(_,i)=>{const a=i/14*6.28;return `<path d="M${112+66*Math.cos(a)} ${70+58*Math.sin(a)} l${8*Math.cos(a)} ${8*Math.sin(a)}" stroke="${s.c}" stroke-width="3" stroke-linecap="round"/>`}).join('');
 }else if(s.shape==='gold'){
  body='M45 70 C55 25 150 22 175 62 C185 80 170 100 140 106 C95 114 55 105 45 70Z';
  tail='M50 70 C10 20 -12 35 0 60 C-5 75 -5 85 0 90 C-12 115 10 125 50 75Z';
  dor='M85 38 C100 0 140 5 140 35Z';pec='M110 100 C102 130 130 132 135 102Z';
 }else{
  body='M40 70 C50 20 160 18 180 65 C188 85 168 110 130 114 C85 118 45 108 40 70Z';
  tail='M45 70 C15 35 0 40 4 70 C0 100 15 105 45 74Z';
  dor='M80 34 C100 5 140 10 145 38Z';pec='M110 100 C100 130 130 132 135 104Z';
 }
 let stripes='';
 if(s.stripe&&k==='clown') stripes=`<g clip-path="url(#c${g})"><path d="M120 10 C105 50 105 90 120 130 L140 130 C125 90 125 50 140 10Z" fill="#fff" stroke="#111" stroke-width="4"/><path d="M70 10 C60 50 60 90 70 130 L84 130 C76 90 76 50 84 10Z" fill="#fff" stroke="#111" stroke-width="4"/></g>`;
 if(k==='angel') stripes=`<g clip-path="url(#c${g})" opacity=".85"><path d="M100 0 v140 M130 0v140 M155 0v140" stroke="#222" stroke-width="9"/></g>`;
 if(s.neon) stripes=`<path d="M60 74 C100 66 140 66 175 70" stroke="#2bf7ff" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#gl${g})"/><path d="M70 84 C110 90 140 88 160 84" stroke="#ff2b4a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 if(s.spots) stripes=`<g clip-path="url(#c${g})" fill="${s.c}" opacity=".55">${[[80,40],[100,30],[120,45],[90,60],[140,35],[150,55]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5"/>`).join('')}</g><path d="M60 95 C100 125 150 120 170 95 C150 125 80 130 60 95Z" fill="#fff" opacity=".8"/>`;
 if(s.tang) stripes=`<path clip-path="url(#c${g})" d="M70 60 C100 30 150 40 160 70 C140 55 110 55 85 80 C75 85 65 75 70 60Z" fill="#061a5c"/>`;
 const eyeX=s.shape==='puff'?150:155,eyeY=s.shape==='puff'?58:60,er=s.shape==='puff'?16:(k==='gus'?16:11);
 const mouth=k==='gus'?`<path d="M170 82 Q176 92 166 94" stroke="#7a2200" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="148" cy="84" rx="8" ry="5" fill="#ff6f8f" opacity=".6"/>`:`<path d="M178 76 q4 3 0 6" stroke="${s.c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 const brow=k==='gus'?`<path d="M140 36 Q155 28 170 38" stroke="#7a2200" stroke-width="5" fill="none" stroke-linecap="round"/>`:'';
 const sparkle=k==='gus'||opts.sparkle?`<g class="sparkle"><path d="M190 20 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#fff8b0"><animateTransform attributeName="transform" type="rotate" from="0 190 34" to="360 190 34" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></path></g>`:'';
 return `<defs>
 <radialGradient id="${g}" cx="60%" cy="35%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".18" stop-color="${s.a}"/><stop offset=".7" stop-color="${s.b}"/><stop offset="1" stop-color="${s.c}"/></radialGradient>
 <linearGradient id="${f}" x1="1" x2="0"><stop offset="0" stop-color="${s.fin}" stop-opacity=".95"/><stop offset="1" stop-color="${s.fin}" stop-opacity=".35"/></linearGradient>
 <pattern id="${sc}" width="12" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 Q6 0 12 10" fill="none" stroke="${s.c}" stroke-opacity=".28" stroke-width="1.4"/></pattern>
 <linearGradient id="${sh}" y2="1" x2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <clipPath id="c${g}"><path d="${body}"/></clipPath>
 <filter id="gl${g}"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <ellipse cx="110" cy="140" rx="60" ry="6" fill="#000" opacity=".12"/>
 <path class="tail" d="${tail}" fill="url(#${f})" stroke="${s.c}" stroke-opacity=".5" stroke-width="2"/>
 <path d="${tail}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="2 6" stroke-width="2" class="tail"/>
 <path d="${dor}" fill="url(#${f})" stroke="${s.c}" stroke-opacity=".5" stroke-width="2"/>
 ${extra}
 <path d="${body}" fill="url(#${g})" stroke="${s.c}" stroke-width="2.5"/>
 ${stripes}
 <path d="${body}" fill="url(#${sc})"/>
 <path d="M70 55 C90 35 140 32 165 50 C130 42 95 46 72 62Z" fill="url(#${sh})"/>
 <path d="M135 40 C150 60 150 90 135 108" stroke="${s.c}" stroke-opacity=".4" stroke-width="3" fill="none"/>
 <path class="fin" d="${pec}" fill="url(#${f})" stroke="${s.c}" stroke-opacity=".5" stroke-width="2"/>
 <circle cx="${eyeX}" cy="${eyeY}" r="${er}" fill="#fff" stroke="${s.c}" stroke-width="2"/>
 <circle cx="${eyeX+3}" cy="${eyeY+2}" r="${er*.58}" fill="#101820"/>
 <circle cx="${eyeX+6}" cy="${eyeY-3}" r="${er*.25}" fill="#fff"/><circle cx="${eyeX}" cy="${eyeY+5}" r="${er*.1}" fill="#fff"/>
 ${brow}${mouth}${sparkle}`;
}
/* ---------- SHELLS / DECOR ---------- */
function decorSVG(k){
 const g=U('d');
 if(k==='scallop'){return `<svg viewBox="0 0 100 90"><defs><radialGradient id="${g}" cy="90%" r="100%"><stop offset="0" stop-color="#fff4e8"/><stop offset=".6" stop-color="#f6a98c"/><stop offset="1" stop-color="#c25b4a"/></radialGradient></defs><ellipse cx="50" cy="84" rx="40" ry="5" fill="#000" opacity=".2"/><path d="M50 80 L10 40 C10 0 90 0 90 40Z" fill="url(#${g})" stroke="#9a4436" stroke-width="2"/>${[-32,-20,-8,4,16,28].map(d=>`<path d="M50 80 Q${50+d*.6} 40 ${50+d+2} 10" stroke="#9a4436" stroke-opacity=".5" fill="none" stroke-width="2"/>`).join('')}<path d="M38 80 h24 l-4 8 h-16z" fill="#e38c74" stroke="#9a4436"/><path d="M30 20 Q50 8 70 20" stroke="#fff" stroke-opacity=".7" stroke-width="4" fill="none"/></svg>`}
 if(k==='conch'){return `<svg viewBox="0 0 120 80"><defs><linearGradient id="${g}" x2="1"><stop offset="0" stop-color="#fff2df"/><stop offset=".5" stop-color="#f2c89d"/><stop offset="1" stop-color="#c98a5a"/></linearGradient><radialGradient id="i${g}"><stop offset="0" stop-color="#ffc0c8"/><stop offset="1" stop-color="#e8708a"/></radialGradient></defs><ellipse cx="60" cy="74" rx="50" ry="5" fill="#000" opacity=".2"/><path d="M10 50 C10 20 60 5 110 30 C95 40 90 60 70 70 C40 76 10 70 10 50Z" fill="url(#${g})" stroke="#8a5a32" stroke-width="2"/><path d="M110 30 l-14 -14 4 12 -14 -10 6 12" fill="#e8b98a" stroke="#8a5a32"/><path d="M22 50 C30 30 70 30 80 45 C70 60 40 64 22 50Z" fill="url(#i${g})"/><path d="M30 30 Q60 15 95 28" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/></svg>`}
 if(k==='star'){return `<svg viewBox="0 0 100 90"><defs><radialGradient id="${g}"><stop offset="0" stop-color="#ffd27a"/><stop offset=".7" stop-color="#ff7a3d"/><stop offset="1" stop-color="#b8401a"/></radialGradient></defs><ellipse cx="50" cy="84" rx="40" ry="5" fill="#000" opacity=".2"/><path d="M50 4 L62 34 L96 36 L70 56 L80 88 L50 70 L20 88 L30 56 L4 36 L38 34Z" fill="url(#${g})" stroke="#8a2c10" stroke-width="2" stroke-linejoin="round"/>${[[50,20],[50,32],[78,40],[66,48],[22,40],[34,48],[68,74],[60,62],[32,74],[40,62]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#fff3d0"/>`).join('')}</svg>`}
 if(k==='chest'){return `<svg viewBox="0 0 110 90"><defs><linearGradient id="${g}" y2="1" x2="0"><stop offset="0" stop-color="#a8682e"/><stop offset="1" stop-color="#5a3010"/></linearGradient></defs><ellipse cx="55" cy="86" rx="50" ry="5" fill="#000" opacity=".25"/><rect x="10" y="40" width="90" height="44" rx="4" fill="url(#${g})" stroke="#3a1e08" stroke-width="2"/><path d="M10 40 C10 6 100 6 100 40Z" fill="url(#${g})" stroke="#3a1e08" stroke-width="2" transform="rotate(-12 10 40)"/><path d="M14 38 L96 22" stroke="#ffd34d" stroke-width="6"/><circle cx="50" cy="28" r="8" fill="#ffd34d"/><circle cx="46" cy="30" r="5" fill="#fff6a0"/><circle cx="60" cy="31" r="6" fill="#ffe066"/><rect x="48" y="50" width="14" height="16" rx="3" fill="#ffd34d" stroke="#8a6a00"/></svg>`}
 if(k==='coral'){return `<svg viewBox="0 0 100 110"><defs><linearGradient id="${g}" y2="1" x2="0"><stop offset="0" stop-color="#ff9fb8"/><stop offset="1" stop-color="#d63c6b"/></linearGradient></defs><g class="plant"><path d="M50 108 C50 80 48 60 30 40 M50 85 C60 60 72 50 78 20 M48 70 C40 55 20 50 15 30 M70 45 C80 40 88 40 92 30 M33 43 C30 30 36 20 30 8" stroke="url(#${g})" stroke-width="10" fill="none" stroke-linecap="round"/></g></svg>`}
}
const COLLECT=['goldfish','scallop','clown','betta','star','angel','tetra','conch','puffer','tang','coral','goldfish','clown','chest','tetra','betta','scallop','angel','puffer','star','tang','tetra','conch','clown','goldfish','coral'];
const isFish=k=>!!SPECIES[k];

/* ---------- WORD PICTURES ---------- */
function P(inner,defs=''){return `<svg viewBox="0 0 200 200"><defs>${defs}</defs><ellipse cx="100" cy="185" rx="70" ry="8" fill="#000" opacity=".15"/>${inner}</svg>`}
const lg=(id,a,b,v)=>`<linearGradient id="${id}" ${v?'x2="0" y2="1"':''}><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const rg=(id,a,b)=>`<radialGradient id="${id}" cx="35%" cy="30%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
const PICS={
 sun:()=>P(`${Array.from({length:12},(_,i)=>`<path d="M100 100 L${100+85*Math.cos(i*.5236-.12)} ${95+85*Math.sin(i*.5236-.12)} L${100+85*Math.cos(i*.5236+.12)} ${95+85*Math.sin(i*.5236+.12)}Z" fill="#ffb300"/>`).join('')}<circle cx="100" cy="95" r="52" fill="url(#su)" stroke="#e08a00" stroke-width="3"/><circle cx="82" cy="78" r="16" fill="#fff" opacity=".5"/>`,rg('su','#fff6a0','#ffb300')),

let voice=null,soundOn=localStorage.getItem('tt_sound')!=='off',lastSaid='';
function pickVoice(){const vs=speechSynthesis.getVoices();if(!vs.length)return;
 const pref=[v=>v.name==='Google US English',v=>/en-US/i.test(v.lang)&&/natural|enhanced|neural|premium/i.test(v.name),v=>/en-US/i.test(v.lang)&&/samantha|aria|jenny|guy|zira/i.test(v.name),v=>/en-US/i.test(v.lang),v=>/^en/i.test(v.lang)];
 for(const p of pref){const v=vs.find(p);if(v){voice=v;return}}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(parts,remember=true){ // parts: string or array of strings (spoken in sequence with small gaps)
 if(remember)lastSaid=parts;
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel(); if(!soundOn)return;
 (Array.isArray(parts)?parts:[parts]).forEach(t=>{const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.rate=.9;u.pitch=1;speechSynthesis.speak(u)});
}

let items=[];try{items=JSON.parse(localStorage.getItem('tt_tank')||'[]')}catch(e){items=[]}
function placeItem(k,i,isNew){
 const el=document.createElement('div');el.className='swimmer';el.dataset.kind=k;
 const box=$('#tankItems');
 if(isFish(k)){
  const w=Math.max(60,Math.min(130,box.clientWidth*0.11))*(k==='puffer'?1.1:k==='tetra'?.7:1);
  el.style.width=w+'px';el.style.height=(w*.8)+'px';
  el.innerHTML=`<div class="bob" style="animation-delay:${-i*.37}s;width:100%;height:100%"><svg viewBox="-20 -30 260 190">${fishSVG(k)}</svg></div>`;
  const top=8+((i*23)%58);el.style.top=top+'%';
  swim(el,i);
 }else{
  const w=Math.max(44,Math.min(90,box.clientWidth*0.08));
  el.style.width=w+'px';el.style.height=w+'px';el.innerHTML=decorSVG(k);
  el.style.left=(8+((i*37)%84))+'%';el.style.bottom='2%';
 }
 if(isNew){el.classList.add('newItem');}
 box.appendChild(el);return el;
}
function swim(el,i){
 let dir=i%2?1:-1,x=Math.random()*80+5;
 const speed=.02+((i*7)%10)/400;
 const step=()=>{x+=dir*speed*(el._boost||1);if(x>88){dir=-1}if(x<2){dir=1}
  el.style.left=x+'%';el.style.transform=`scaleX(${dir})`+(el._spin?` rotate(${el._spin}deg)`:'');requestAnimationFrame(step)};
 requestAnimationFrame(step);
}
function renderTank(){$('#tankItems').innerHTML='';items.forEach((k,i)=>placeItem(k,i,false))}
function addToTank(){
 const k=COLLECT[items.length%COLLECT.length];items.push(k);
 try{localStorage.setItem('tt_tank',JSON.stringify(items.slice(-60)))}catch(e){}
 const el=placeItem(k,items.length-1,true);
 // celebrate: make new fish do a flip
 if(isFish(k)){el._boost=6;let a=0;const t=setInterval(()=>{a+=30;el._spin=a;if(a>=720){clearInterval(t);el._spin=0;el._boost=1}},40)}
 const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,40);
 return k;
}
/* ---------- SPARKLES ---------- */
const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:8';document.body.appendChild(cv);
const cx=cv.getContext('2d');let parts=[];
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);
function burst(x,y,n){const C=['#fff8b0','#ffd34d','#ffffff','#7ff0ff','#ff9ad5','#b6ff7a'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:60+Math.random()*40,s:4+Math.random()*7,c:C[i%C.length],r:Math.random()*6})}if(!anim)loop()}
let anim=false;
function star(x,y,s,r){cx.save();cx.translate(x,y);cx.rotate(r);cx.beginPath();for(let i=0;i<8;i++){const rad=i%2?s*.35:s;cx.lineTo(Math.cos(i*Math.PI/4)*rad,Math.sin(i*Math.PI/4)*rad)}cx.closePath();cx.fill();cx.restore()}
function loop(){anim=true;cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.98;p.life--;p.r+=.1;cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=12;star(p.x,p.y,p.s,p.r)});cx.globalAlpha=1;if(parts.length)requestAnimationFrame(loop);else{anim=false;cx.clearRect(0,0,innerWidth,innerHeight)}}

let order=[],cur=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextRound(){
 if(!order.length)order=shuffle(ROUNDS.slice());
 cur=order.pop();locked=false;
 const [w,snd,good,bad]=cur;
 $('#pic').innerHTML=PICS[w]();
 $('#bubbleSay').innerHTML=`${SPK.replace('#fff','#1f6a99')}<span>${w}</span>`;
 const opts=shuffle([good,bad]);
 $('#choices').innerHTML=opts.map(o=>`<button class="choice" data-w="${o}" aria-label="${o}">${o}<span class="say" data-say="${o}" role="button" aria-label="hear ${o}">${SPK}</span></button>`).join('');
 document.querySelectorAll('.choice').forEach(b=>{
  b.addEventListener('click',e=>{if(e.target.closest('.say')){e.stopPropagation();say(b.dataset.w,false);return}answer(b)});
  b.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover)').matches&&!locked)say(b.dataset.w,false)});
 });
 prompt();
}
function prompt(){const [w]=cur;say([w+'.','Which word starts like '+w+'?'])}
function answer(b){
 if(locked)return;const [w,snd,good]=cur;
 if(b.dataset.w===good){
  locked=true;b.classList.add('right');
  const m=$('#mascot');m.classList.remove('flip');void m.offsetWidth;m.classList.add('flip');
  const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,70);
  const mr=m.getBoundingClientRect();burst(mr.left+mr.width/2,mr.top+mr.height/2,40);
  const k=addToTank();
  const p=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  say([`${p} ${w}, ${good}. Same sound.`,isFish(k)?'A new fish joined your tank.':'A new treasure for your tank.']);
  setTimeout(nextRound,4200);
 }else{
  b.classList.remove('tryagain');void b.offsetWidth;b.classList.add('tryagain');
  const m=$('#mascot');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');
  say([`Good try. Listen: ${SOUND[snd]}... ${w}.`,`${b.dataset.w} has a different start.`,'Take your time. Try again.']);
 }
}
$('#repeatBtn').onclick=()=>{if(lastSaid)say(lastSaid)};
$('#stopBtn').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel()};
$('#soundBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('tt_sound',soundOn?'on':'off');setSoundIcon();if(soundOn)say('Sound is on.',false);else speechSynthesis&&speechSynthesis.cancel()};
$('#picCard').onclick=()=>{if(cur)say(cur[0],false)};
$('#mascot').onclick=()=>{say(["Hi, I'm Gus.","I like your tank."],false)};
$('#goBtn').onclick=()=>{$('#start').remove();say(["Hi, I'm Gus. Let's fill your tank.","Listen to the word, then pick the word that starts the same."]);setTimeout(nextRound,5200)};
$('#mascot').innerHTML=fishSVG('gus');$('#startFish').innerHTML=fishSVG('gus');
setSoundIcon();drawTankBg();renderTank();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderTank,300)});
</script></body></html>
